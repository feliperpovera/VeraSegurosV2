# Actualiza /mercados/ (TRM, monedas y noticias) varias veces al día y publica si algo cambió.
name: Actualizar mercados
on:
  schedule:
    - cron: '0 11,14,17,20,23 * * *'   # 6, 9, 12, 15 y 18 h hora Colombia
  workflow_dispatch:
permissions:
  contents: write
concurrency: mercados
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/build-seo.mjs
      - name: Publicar cambios
        run: |
          git config user.name "vera-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A mercados data sitemap.xml
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Mercados: TRM, monedas y noticias actualizadas"
          git push
