<style>

<script>
(function(){
  var API = 'https://cwfvqusyvfdohjmgefli.supabase.co/functions/v1/autos';
  var WA = 'https://wa.me/573156705627?text=';
  var $ = function(id){ return document.getElementById(id); };
  var modo = 'placa', ciudadesMap = {}, ofertas = [];
  function api(body){ return fetch(API, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body) }).then(function(r){ return r.json(); }); }
  function alto(){ if (parent !== window) parent.postMessage({ veraCotizador:'alto', alto: document.documentElement.scrollHeight + 10 }, location.origin); }
  new ResizeObserver(alto).observe(document.body);
  function opts(sel, arr, ph){ sel.innerHTML = '<option value="">' + ph + '</option>' + arr.map(function(o){ var v = typeof o === 'string' ? o : o.v; var t = typeof o === 'string' ? o : o.t; return '<option value="' + String(v).replace(/"/g,'&quot;') + '">' + t.replace(/</g,'&lt;') + '</option>'; }).join(''); sel.disabled = !arr.length; }
  var peso = function(n){ return '$' + Math.round(n).toLocaleString('es-CO'); };

  // Modo placa / 0 km
  [].forEach.call(document.querySelectorAll('.seg button'), function(b){
    b.addEventListener('click', function(){
      modo = b.dataset.modo;
      [].forEach.call(document.querySelectorAll('.seg button'), function(x){ x.setAttribute('aria-pressed', x === b); });
      $('m-placa').classList.toggle('oculto', modo !== 'placa');
      $('m-nuevo').classList.toggle('oculto', modo !== 'nuevo');
      if (modo === 'nuevo' && $('marca').options.length < 2) api({ accion:'marcas' }).then(function(m){ opts($('marca'), (m || []).sort(), 'Elige la marca'); });
    });
  });
  var y = new Date().getFullYear();
  opts($('modelo'), [y + 1, y, y - 1].map(String), 'Año');
  function cargarRefs(){
    var m = $('marca').value, a = $('modelo').value;
    opts($('version'), [], 'Elige la referencia');
    if (!m || !a) return;
    api({ accion:'referencias', marca:m, modelo:a }).then(function(r){ opts($('ref'), (r || []).sort(), 'Elige la referencia'); });
  }
  $('marca').addEventListener('change', cargarRefs);
  $('modelo').addEventListener('change', cargarRefs);
  $('ref').addEventListener('change', function(){
    if (!$('ref').value) return;
    api({ accion:'vehiculos', marca:$('marca').value, modelo:$('modelo').value, ref:$('ref').value, ceroKm:true }).then(function(v){
      opts($('version'), (v || []).map(function(x){ return { v:x.fasecolda, t:x.linea + (x.valor ? ' · ' + peso(x.valor) : '') }; }), 'Elige la versión');
    });
  });

  // Ciudades (autocompletar)
  var tCiudad;
  $('ciudad').addEventListener('input', function(){
    clearTimeout(tCiudad);
    var q = $('ciudad').value.trim();
    if (q.length < 3 || ciudadesMap[q]) return;
    tCiudad = setTimeout(function(){
      api({ accion:'ciudades', q:q.split(',')[0] }).then(function(c){
        $('ciudades').innerHTML = (c || []).map(function(x){ ciudadesMap[x.nombre] = x.code; return '<option value="' + x.nombre.replace(/"/g,'&quot;') + '">'; }).join('');
      });
    }, 300);
  });

  // Envío
  $('f1').addEventListener('submit', function(e){
    e.preventDefault();
    var err = $('err'); err.textContent = '';
    var placa = $('placa').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    var d = { accion:'cotizar', nombre:$('nombre').value, apellido:$('apellido').value, cedula:$('cedula').value, nacimiento:$('nacimiento').value,
      genero:$('genero').value, ciudad: ciudadesMap[$('ciudad').value] || '', telefono:$('telefono').value, email:$('email').value, acepta:$('acepta').checked };
    if (modo === 'placa') { if (!/^[A-Z]{3}\d{2}[A-Z0-9]$/.test(placa)) return err.textContent = 'Revisa la placa (ej. ABC123).'; d.placa = placa; }
    else { if (!$('version').value) return err.textContent = 'Elige marca, año, referencia y versión.'; d.fasecolda = $('version').value; d.modelo = $('modelo').value; d.ceroKm = true; }
    if (!d.nombre.trim() || !d.apellido.trim()) return err.textContent = 'Escribe tu nombre y apellido.';
    if (!/^\d{5,12}$/.test(d.cedula)) return err.textContent = 'Revisa la cédula.';
    if (!d.nacimiento) return err.textContent = 'Falta la fecha de nacimiento.';
    if (!d.ciudad) return err.textContent = 'Elige la ciudad de la lista.';
    if (!/^3\d{9}$/.test(d.telefono)) return err.textContent = 'Revisa el celular (10 dígitos).';
    if (!d.acepta) return err.textContent = 'Debes autorizar el tratamiento de datos.';
    if ($('paso-sms').classList.contains('oculto')) return enviarSms(d.telefono);
    d.codigo = $('codigo').value.replace(/\D/g, '');
    if (d.codigo.length < 4) return err.textContent = 'Escribe el código del SMS.';
    var q = new URLSearchParams(location.search); d.utm = { source:q.get('utm_source'), medium:q.get('utm_medium'), campaign:q.get('utm_campaign') };
    $('enviar').disabled = true; $('enviar').textContent = 'Enviando…';
    api(d).then(function(r){
      if (!r.ok) {
        $('enviar').disabled = false; $('enviar').textContent = 'Confirmar código';
        err.textContent = r.error === 'codigo' ? 'El código no es correcto o venció.' : r.error === 'limite' ? 'Ya cotizaste hoy. Escríbenos por WhatsApp y te ayudamos.' : r.error === 'placa' ? 'No encontramos datos con esa placa. Prueba "Carro nuevo" o escríbenos.' : 'No pudimos cotizar ahora. Escríbenos por WhatsApp.';
        return;
      }
      if (parent !== window) parent.postMessage({ veraCotizador:'lead', aseguradora:'', plan:'auto', nivel:'auto' }, location.origin);
      $('f1').classList.add('oculto'); $('res').classList.remove('oculto');
      try { parent.document.getElementById('cotizadorFrame').scrollIntoView({ behavior:'smooth', block:'start' }); } catch (e) { scrollTo(0, 0); }
      d.placaTxt = placa || 'vehículo 0 km';
      sondear(r.id, r.t, d.placaTxt);
    }).catch(function(){ $('enviar').disabled = false; $('enviar').textContent = 'Ver precios'; err.textContent = 'Sin conexión. Intenta de nuevo.'; });
  });

  function enviarSms(tel){
    var err = $('err'), b = $('enviar');
    b.disabled = true; b.textContent = 'Enviando SMS…';
    api({ accion:'sms', telefono:tel }).then(function(r){
      b.disabled = false;
      if (!r.ok) { b.textContent = 'Ver precios'; err.textContent = 'No pudimos enviar el SMS. Revisa el celular.'; return; }
      $('paso-sms').classList.remove('oculto'); b.textContent = 'Confirmar código'; $('codigo').focus();
      // Conversión de Google Ads (GTM en la página padre): primer formulario completo y válido. Una vez por visita.
      if (!enviarSms.medido && parent !== window) { enviarSms.medido = true; parent.postMessage({ veraCotizador:'autos_form', modo: modo }, location.origin); }
    }).catch(function(){ b.disabled = false; b.textContent = 'Ver precios'; err.textContent = 'Sin conexión. Intenta de nuevo.'; });
  }
  $('reenviar').addEventListener('click', function(){ enviarSms($('telefono').value); });
  $('telefono').addEventListener('input', function(){ $('paso-sms').classList.add('oculto'); $('enviar').textContent = 'Ver precios'; });

  var ver = (new URLSearchParams(location.search).get('ver') || '').split('.');
  if (ver.length === 2) { $('f1').classList.add('oculto'); $('res').classList.remove('oculto'); setTimeout(function(){ sondear(ver[0], ver[1], 'mi vehículo'); }, 0); }

  var MAX = 180; // segundos esperando aseguradoras
  function sondear(id, t, placa){
    api({ accion:'ofertas', id:id, t:t }).then(function(r){
      if (!r.ok) return;
      ofertas = r.ofertas || []; opp = r.opp || ''; cliente = r.cliente || cliente; placaReal = r.placa || placaReal;
      pintar(placa);
      var sin = r.sin_oferta || [], tec = sin.some(function(x){ return x.tecnico; }) && r.reintento;
      $('sin').classList.toggle('oculto', !sin.length);
      $('sin').innerHTML = '<h3>No cotizaron (' + sin.length + ')</h3><ul>' + sin.map(function(x){
        return '<li><span style="text-transform:capitalize">' + esc(String(x.aseguradora).toLowerCase()) + '</span><span>' + (x.tecnico ? (r.reintento ? 'Sin respuesta · reintentando' : 'Sin respuesta') : 'No asegura este vehículo') + '</span></li>'; }).join('') + '</ul>' +
        (tec ? '<p>Volvemos a consultar en 5 minutos las que no respondieron. Si cierras esta página, te enviamos los precios por correo.</p>' : '');
      if (tec && MAX < 600) MAX = 600;
      if (r.pdf) { $('pdf').href = r.pdf; $('pdf').classList.remove('oculto'); }
      $('barra').style.width = Math.min(100, r.segundos / MAX * 100) + '%';
      var fin = r.segundos >= MAX;
      $('estado').textContent = fin ? (ofertas.length ? ofertas.length + ' ofertas para tu vehículo' : 'Las aseguradoras no respondieron. Te contactamos por WhatsApp.')
        : (ofertas.length ? ofertas.length + ' ofertas · seguimos consultando…' : 'Consultando aseguradoras…');
      if (!fin) setTimeout(function(){ sondear(id, t, placa); }, 4000);
    }).catch(function(){ setTimeout(function(){ sondear(id, t, placa); }, 6000); });
  }
  // Logos propios del sitio (/assets/lg/) para que se vean igual que el resto de Vera; si no hay, el de Agentemotor.
  var LOGOS = { allianz:'allianz', qualitas:'qualitas', 'quálitas':'qualitas', sura:'sura', bolivar:'bolivar', 'bolívar':'bolivar', axa:'axa-colpatria', colpatria:'axa-colpatria',
    hdi:'hdi', mapfre:'mapfre', mundial:'mundial', sbs:'sbs', solidaria:'solidaria', zurich:'zurich', estado:'estado', chubb:'chubb' };
  function logo(o){ var n = String(o.aseguradora || '').toLowerCase(); for (var k in LOGOS) if (n.indexOf(k) > -1) return '/assets/lg/' + LOGOS[k] + '.png'; return o.logo; }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
  var pintadas = -1, opp = '', cliente = '', placaReal = '';
  // Niveles (los calcula el servidor). Orden: Premium primero.
  var NIVELES = [
    { k:'Premium',  d:'El plan más completo de cada aseguradora.' },
    { k:'Esencial', d:'El plan intermedio: más coberturas y asistencias.' },
    { k:'Básica',   d:'El plan de entrada de cada aseguradora: el mejor precio.' }];
  var CLAVE = [['RESEXT','Responsabilidad civil'], ['DEBPTD','Pérdida total por daño'], ['DEBPTH','Pérdida total por hurto'],
    ['DEBPPD','Daños parciales'], ['VEHRPT','Carro de reemplazo'], ['SERGRU','Grúa']];
  function cubre(v){ return v != null && !/^\s*(no cubre|no|n\/a|)\s*$/i.test(String(v)); }
  function resumen(o){
    var cob = o.coberturas || [];
    return '<ul class="clave">' + CLAVE.map(function(c){
      var x = cob.filter(function(y){ return y.tag === c[0]; })[0]; if (!x) return '';
      var si = cubre(x.valor), v = String(x.valor);
      return '<li class="' + (si ? 'si' : 'no') + '"><span>' + c[1] + '</span><b>' + (si ? (/^\$|smdlv|smmlv|d[ií]as/i.test(v) ? esc(v.slice(0, 26)) : 'Incluido') : 'No incluye') + '</b></li>';
    }).join('') + '</ul>';
  }
  function pintar(placa){
    if (ofertas.length === pintadas) return; // sin cambios: no repintar (reiniciaría la animación)
    pintadas = ofertas.length;
    ofertas.sort(function(a, b){ return (a.precio || 9e12) - (b.precio || 9e12); });
    var veh = placaReal ? 'la placa ' + placaReal : placa;
    function tarjeta(o, n, i, sello){
      var msg = 'Hola Vera Seguros, soy ' + (cliente || '(nombre)') + '. Quiero expedir el seguro todo riesgo ' + n + ' para ' + veh + ': ' + o.aseguradora + ' ' + o.plan + ' (' + (o.precio ? peso(o.precio) : '') + ' al año).' + (opp ? ' Ref. ' + opp : '');
      return '<article class="of' + (i === 0 || sello ? ' top' : '') + '">' + (logo(o) ? '<img src="' + esc(logo(o)) + '" alt="' + esc(o.aseguradora) + '">' : '<b>' + esc(o.aseguradora) + '</b>') +
        '<div><div class="pl">' + esc(o.plan) + (sello ? '<span class="rec">' + sello + '</span>' : i === 0 ? '<span class="rec">Mejor precio</span>' : '') + '</div><div class="cu">' + esc(String(o.cuotas || '').replace(/^.*::\s*/, '')) + '</div></div>' +
        '<div class="pr">' + (o.precio ? peso(o.precio) : '—') + '<small>al año</small></div>' + resumen(o) +
        (o.coberturas && o.coberturas.length ? '<details><summary>Ver todas las coberturas</summary><ul>' + o.coberturas.map(function(c){ return '<li><span>' + esc(c.cobertura) + '</span><b>' + esc(c.valor) + '</b></li>'; }).join('') + '</ul></details>' : '') +
        '<a class="btn quiero" href="' + WA + encodeURIComponent(msg) + '" target="_blank" rel="noopener">Expedir</a></article>';
    }
    // Opción Vera: SURA Global (con franquicia: deducible 1 SMMLV) y el plan más completo de Bolívar.
    function de(re){ return ofertas.filter(function(o){ return re.test(o.aseguradora); }); }
    var suraG = de(/sura/i).filter(function(o){ return /global/i.test(o.plan); });
    var conFranquicia = suraG.filter(function(o){ return (o.coberturas || []).some(function(c){ return c.tag === 'DEBPPD' && /1\s*SMMLV/i.test(c.valor); }); });
    var bol = de(/bol[ií]var/i), bolFull = bol.filter(function(o){ return o.nivel === 'Premium'; });
    var veras = [conFranquicia[0] || suraG[0], (bolFull.length ? bolFull : bol).slice().sort(function(a, b){ return (b.precio || 0) - (a.precio || 0); })[0]].filter(Boolean);
    var html = veras.length ? '<section class="nivel vera"><h3 class="nv">Opción Vera</h3><p class="nvd">Las que recomendamos: SURA y Bolívar, con su cobertura más completa.</p>' +
      veras.map(function(o){ return tarjeta(o, o.nivel || '', 0, 'Opción Vera'); }).join('') + '</section>' : '';
    NIVELES.forEach(function(n){
      var del = ofertas.filter(function(o){ return (o.nivel || 'Básica') === n.k; });
      if (!del.length) return;
      html += '<section class="nivel"><h3 class="nv">' + n.k + ' <span>desde ' + peso(del[0].precio || 0) + '</span></h3><p class="nvd">' + n.d + '</p>' + del.map(function(o, i){ return tarjeta(o, n.k, i); }).join('') + '</section>';
    });
    $('ofertas').innerHTML = html;
  }

})();
</script>
</body>
</html>
