<style>
/* Tokens de /diseno.css (sistema visual de Vera Seguros). */
:root{--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ink:#1d2433;--ink-2:#4b5263;--ink-3:#646a78;--canvas:#fff;--parchment:#f5f5f7;--hairline:#e2e3e8;--navy:#203152;
  --accent:#218166;--cta:#25D366;--cta-hover:#3ce17c;--cta-ink:#0b2217;--link:#2d4777;--bad:#B23B4E}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;font:15px/1.47 var(--font);color:var(--ink);background:var(--parchment);-webkit-font-smoothing:antialiased}
::selection{background:rgba(33,129,102,.22)}

.bar{max-width:1120px;margin:0 auto;min-height:64px;padding:8px 22px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.bar img{height:44px;width:auto;display:block}

nav button{background:none;border:0;padding:10px 0;font:14px var(--font);letter-spacing:-.01em;color:var(--ink-2);cursor:pointer}
nav button:hover,nav button[aria-current]{color:var(--ink)}
nav button[aria-current]{font-weight:600}
.yo{margin-left:auto;font-size:13px;color:var(--ink-3)}
.yo button{background:none;border:0;color:var(--link);cursor:pointer;font:inherit;padding:0}

h1{font-family:var(--font-display);font-size:32px;font-weight:600;letter-spacing:-.022em;margin:0 0 18px}
h2{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:0 0 12px}
.card{background:var(--canvas);border:1px solid var(--hairline);border-radius:22px;box-shadow:0 18px 40px -28px rgba(29,36,51,.35);padding:22px;margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--canvas);border:1px solid var(--hairline);border-radius:18px;padding:16px 18px}
.kpi small{color:var(--ink-3);display:block;font-size:13px}
.kpi strong{font-family:var(--font-display);font-size:26px;font-weight:600;letter-spacing:-.02em;display:block;margin:2px 0}
.up{color:var(--accent)}.down{color:var(--bad)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--hairline);vertical-align:top}
th{font-size:12px;color:var(--ink-3);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
input,select{font:inherit;padding:10px 12px;border:1px solid var(--hairline);border-radius:12px;background:#fff;color:var(--ink);min-width:0}

button.b{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 20px;border-radius:980px;border:0;background:var(--navy);color:#fff;font:600 15px var(--font);cursor:pointer}
button.b:hover{background:#2d4777}
.wa{display:inline-flex;align-items:center;min-height:36px;padding:6px 16px;border-radius:980px;background:var(--cta);color:var(--cta-ink);font-weight:600;text-decoration:none;font-size:14px}
.wa:hover{background:var(--cta-hover)}
button.s{font:14px var(--font);min-height:36px;padding:6px 14px;border-radius:980px;border:1px solid var(--hairline);background:#fff;color:var(--ink);cursor:pointer}

button:disabled{opacity:.5}
.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vacio{color:var(--ink-3);padding:12px 0;margin:0}

.login{max-width:400px;margin:12vh auto;text-align:center}
.login img{height:56px;margin-bottom:8px}
.login input{width:100%;margin:14px 0}
.login button{width:100%}
a{color:var(--link)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.lt{list-style:none;padding:0;margin:0}

.oculto{display:none}
.solo-lectura [data-ren],.solo-lectura [data-car],.solo-lectura [data-lim],.solo-lectura [data-sal],.solo-lectura [data-p]{pointer-events:none;color:inherit;text-decoration:none}

.perfil{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font:600 22px var(--font-display);flex:none}
.datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:18px 0 14px}
.dato small{display:block;color:var(--ink-3);font-size:12px}.dato b{font-weight:600;word-break:break-word}
.seguros{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.seguro{border:1px solid var(--hairline);border-radius:16px;padding:16px;background:#fff}

.barra{height:6px;border-radius:6px;background:var(--parchment);margin:10px 0 6px;overflow:hidden}.barra i{display:block;height:100%;background:var(--accent);border-radius:6px}
.seguro.pronto .barra i{background:#eda100}.seguro.vence .barra i{background:var(--bad)}
summary{cursor:pointer;color:var(--link);margin-top:14px}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:980px;background:var(--parchment);color:var(--ink-2);margin:2px 4px 2px 0;white-space:nowrap}
.chip.ok{background:#e3f4ee;color:#16664f}.chip.alerta{background:#fbe9ec;color:var(--bad)}.chip.curso{background:#e6ebf4;color:var(--navy)}
.flujo{display:flex;align-items:stretch;overflow-x:auto;padding:2px 2px 6px}

.paso[aria-pressed=true]{box-shadow:0 0 0 2px var(--ink) inset}
.proyectos{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.tablero{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;margin-bottom:18px}
.columna{background:var(--canvas);border:1px solid var(--hairline);border-radius:18px;padding:14px;min-width:200px}
.columna h2{font-size:15px}
.lead{border:1px solid var(--hairline);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff;font-size:14px}
.lead.tarde{border-left:4px solid var(--bad)}
.zonas{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:18px}
.zona{background:var(--canvas);border:1px solid var(--hairline);border-top:5px solid #eda100;border-radius:18px;padding:16px;display:grid;gap:8px;align-content:start}
.zona.d40{border-top-color:#eb6834}.zona.d50{border-top-color:var(--bad)}
.zona-total{margin:0}.zona-total strong{font:600 24px var(--font-display)}
.zona-fila{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--hairline);font-size:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.segmento{display:inline-flex;background:var(--parchment);border-radius:980px;padding:3px;gap:2px;flex-wrap:wrap}
.segmento button{border:0;background:none;border-radius:980px;padding:6px 13px;font:14px var(--font);color:var(--ink-2);cursor:pointer}
.segmento button:hover{color:var(--ink)}.segmento button[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(29,36,51,.15)}

.filtros select{padding:6px 10px}
button.chip{border:0;cursor:pointer;font-family:var(--font)}
.aviso{background:#fbf1dc;color:#7a5200;border-radius:12px;padding:10px 14px;font-size:14px;margin:0 0 18px}
.barra-fila{display:grid;grid-template-columns:1fr auto;gap:3px 10px;width:100%;background:none;border:0;border-radius:10px;padding:7px 8px;font:14px var(--font);color:var(--ink);text-align:left;cursor:pointer}
.barra-fila:hover{background:var(--parchment)}.barra-fila[aria-pressed=true]{background:#e6ebf4}
.barra-nombre{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.barra-valor{font-variant-numeric:tabular-nums}
.barra-pista{grid-column:1/-1;height:6px;border-radius:6px;background:var(--parchment);overflow:hidden}.barra-pista i{display:block;height:100%;background:#2a78d6;border-radius:6px}

<body>
<div id="app"><p class="login muted">Cargando…</p></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';
const sb = createClient('https://cwfvqusyvfdohjmgefli.supabase.co', 'sb_publishable_r9GjrtKgOR9FEm-bm3lB8A_bnnQOAz5');
const app = document.getElementById('app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cop = (n) => '$' + Math.round(n || 0).toLocaleString('es-CO');
const hoy = () => new Date().toLocaleDateString('en-CA', { timeZone: 'America/Bogota' }); // YYYY-MM-DD
const fecha = (d) => d ? new Date(d).toLocaleDateString('es-CO', { day: 'numeric', month: 'short', timeZone: 'America/Bogota' }) : '';
let yo = null, equipo = [], vista = null, timer = null;
const nombreDe = (id) => equipo.find((e) => e.id === id)?.nombre ?? '—';

async function inicio() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return pantallaLogin();
  const { data } = await sb.rpc('mi_empleado');
  if (!data?.id) {
    app.innerHTML = `<div class="login card"><h2>Sin acceso</h2><p>${esc(session.user.email)} no está registrado como empleado. Pídele al gerente que te agregue.</p><button class="b" id="salir">Salir</button></div>`;
    document.getElementById('salir').onclick = salir;
    return;
  }
  yo = data;
  equipo = (await sb.from('empleado').select('*').order('nombre')).data ?? [];
  // Acceso total (gerente) ve todo; limitado (asesor) solo su trabajo diario.
  document.body.classList.toggle('solo-lectura', yo.rol === 'junta');
  const tabs = yo.rol === 'junta' ? [['produccion', 'Producción'], ['financiero', 'Financiero'], ['renovaciones', 'Renovaciones'], ['cartera', 'Cartera']]
    : yo.rol === 'gerente'
    ? [['produccion', 'Producción'], ['financiero', 'Financiero'], ['estrategia', 'Estrategia digital'], ['clientes', 'Clientes'], ['contactos', 'Contactos'], ['renovaciones', 'Renovaciones'], ['cartera', 'Cartera'], ['cotizar', 'Cotizar autos'], ['revisar', 'Por revisar'], ['ajustes', 'Ajustes']]
    : [['clientes', 'Clientes'], ['contactos', 'Contactos'], ['estrategia', 'Estrategia digital'], ['renovaciones', 'Renovaciones'], ['cartera', 'Cartera'], ['cotizar', 'Cotizar autos']];
  app.innerHTML = `<header><div class="bar"><img src="/assets/logo-vera-wordmark.png" alt="Vera Seguros"><nav>${tabs.map(([k, t]) => `<button data-v="${k}">${t}</button>`).join('')}</nav>
    <span class="yo">${esc(yo.nombre)} · ${yo.rol === 'junta' ? '' : '<button id="clave">Contraseña</button> · '}<button id="salir">Salir</button></span></div></header><main id="m"></main>`;
  document.getElementById('clave')?.addEventListener('click', () => pantallaClave(true));
  app.querySelectorAll('nav button').forEach((b) => b.onclick = () => ir(b.dataset.v));
  document.getElementById('salir').onclick = salir;
  const v = location.hash.slice(1);
  ir(tabs.some(([k]) => k === v) ? v : tabs[0][0]);
}

// Ingreso con correo (o usuario "junta") y contraseña. Las contraseñas las asigna un gerente en Ajustes;
// no se usan enlaces ni códigos por correo (el filtro de Outlook los gastaba).
const USUARIO_SIN_CORREO = '@junta.veraseguros.com';
function pantallaLogin(msg = '') {
  app.innerHTML = `<form class="login card" id="f"><img src="/assets/logo-vera-wordmark.png" alt="Vera Seguros"><h2>CRM</h2>
    <input id="usuario" required placeholder="Correo de Vera o usuario" autocomplete="username">
    <input id="clave" type="password" required placeholder="Contraseña" autocomplete="current-password" style="margin-top:0">
    <button class="b">Entrar</button><p id="msg" class="muted">${esc(msg)}</p>
    <p class="muted">¿No tienes contraseña o la olvidaste? Pídesela a gerencia.</p></form>`;
  document.getElementById('f').onsubmit = async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button'); btn.disabled = true;
    const u = document.getElementById('usuario').value.trim().toLowerCase();
    const { error } = await sb.auth.signInWithPassword({ email: u.includes('@') ? u : u + USUARIO_SIN_CORREO, password: document.getElementById('clave').value });
    btn.disabled = false;
    if (error) return document.getElementById('msg').textContent = 'Correo o contraseña incorrectos.';
    inicio();
  };
}
function pantallaClave(desdeCrm = false) {
  app.innerHTML = `<form class="login card" id="f"><img src="/assets/logo-vera-wordmark.png" alt="Vera Seguros"><h2>${desdeCrm ? 'Cambiar contraseña' : 'Crea tu contraseña'}</h2>
    <p class="muted">Mínimo 10 caracteres, con letras y números.</p>
    <input id="c1" type="password" required minlength="10" placeholder="Nueva contraseña" autocomplete="new-password">
    <input id="c2" type="password" required minlength="10" placeholder="Repítela" autocomplete="new-password" style="margin-top:0">
    <button class="b">Guardar y entrar</button><p id="msg" class="muted"></p>${desdeCrm ? '<p><a href="#" id="volver">← Volver</a></p>' : ''}</form>`;
  document.getElementById('volver')?.addEventListener('click', (e) => { e.preventDefault(); inicio(); });
  document.getElementById('f').onsubmit = async (e) => {
    e.preventDefault();
    const c1 = document.getElementById('c1').value, msg = (t) => document.getElementById('msg').textContent = t;
    if (c1 !== document.getElementById('c2').value) return msg('Las contraseñas no coinciden.');
    if (c1.length < 10 || !/[A-Za-z]/.test(c1) || !/\d/.test(c1)) return msg('Usa mínimo 10 caracteres, con letras y números.');
    const { error } = await sb.auth.updateUser({ password: c1, data: { clave_creada: true } });
    if (error) return msg(/different|same/i.test(error.message) ? 'Usa una contraseña distinta a la anterior.' : 'No se pudo guardar. Intenta de nuevo.');
    inicio();
  };
}
async function salir() { await sb.auth.signOut(); location.hash = ''; pantallaLogin(); }

function ir(v) {
  vista = v; location.hash = v; clearInterval(timer);
  app.querySelectorAll('nav button').forEach((b) => b.toggleAttribute('aria-current', b.dataset.v === v));
  const m = document.getElementById('m');
  m.innerHTML = '<p class="muted">Cargando…</p>';
  ({ produccion, financiero, estrategia, clientes, contactos, renovaciones, cartera, cotizar, revisar, ajustes })[v]?.(m);
}
const masDias = (n) => { const v = new Date(hoy() + 'T12:00:00'); v.setDate(v.getDate() + n); return v.toLocaleDateString('en-CA'); };
const ETAPAS = ['nuevo', 'contactado', 'cotizado', 'emitido', 'perdido'];
const opcionesEquipo = (sel) => equipo.filter((e) => e.activo && e.rol !== 'comercial').map((e) => `<option value="${e.id}"${e.id === sel ? ' selected' : ''}>${esc(e.nombre)}</option>`).join('');
// Operativo: el equipo con acceso más "Vera" (operación general, sin usuario), que es el valor por defecto.
const opcionesOperativo = (sel) => equipo.filter((e) => e.activo && (e.rol !== 'comercial' || e.codigo === 'VERA')).map((e) => `<option value="${e.id}"${e.id === sel ? ' selected' : ''}>${esc(e.nombre)}</option>`).join('');
const fechaLarga = (d) => d ? new Date(d + 'T12:00:00').toLocaleDateString('es-CO', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
const diasHasta = (d) => Math.round((new Date(d + 'T12:00:00') - new Date(hoy() + 'T12:00:00')) / 864e5);
const enlazar = (m) => m.querySelectorAll('[data-p]').forEach((a) => a.onclick = (e) => { e.preventDefault(); ficha(m, a.dataset.p); });
const enlazarPdf = (m) => m.querySelectorAll('[data-pdf]').forEach((a) => a.onclick = async (e) => {
  e.preventDefault();
  const v = window.open('', '_blank'); // se abre antes de esperar: si no, el navegador lo bloquea
  const { data: u } = await sb.storage.from('caratulas').createSignedUrl(a.dataset.pdf, 300);
  if (u?.signedUrl) v.location = u.signedUrl; else v.close();
});

// Supabase entrega máximo 1000 filas por consulta: se piden por páginas hasta traerlas todas.
// Personas de una lista de pólizas, por id. Los lotes salen en paralelo.
async function personas(pol, columnas) {
  const ids = [...new Set(pol.map((x) => x.persona_id).filter(Boolean))], lotes = [];
  for (let i = 0; i < ids.length; i += 200) lotes.push(sb.from('persona').select(columnas).in('id', ids.slice(i, i + 200)));
  return Object.fromEntries((await Promise.all(lotes)).flatMap((r) => r.data ?? []).map((p) => [p.id, p]));
}
async function todas(consulta) {
  const filas = [];
  for (let i = 0; ; i += 1000) {
    const { data, error } = await consulta().order('id').range(i, i + 999); // sin orden fijo las páginas se pisan y faltan filas
    if (error) throw error;
    filas.push(...data);
    if (data.length < 1000) return filas;
  }
}

// ───────── Producción ─────────
function mesKey(d) { return new Date(d).toLocaleDateString('en-CA', { timeZone: 'America/Bogota' }).slice(0, 7); }
function variacion(a, b) { if (!b) return '—'; const p = Math.round((a - b) / b * 100); return `<span class="${p >= 0 ? 'up' : 'down'}">${p >= 0 ? '▲' : '▼'} ${Math.abs(p)}%</span>`; }
const nombreMes = (k) => new Date(k + '-15').toLocaleDateString('es-CO', { month: 'long', year: 'numeric' });
// ───────── Producción: una sola carga y todo lo demás se calcula en el navegador (cambiar filtros es instantáneo) ─────────
let prodDatos = null, prodHora = 0, prodFiltro = null, prodArl = [], prodInformes = [];
const METRICAS_PROD = { prima: ['Prima neta', (xs) => xs.reduce((a, x) => a + (+x.prima_neta || 0), 0)], polizas: ['Pólizas', (xs) => xs.length] };
const AÑO_COMPLETO = 2025;
const ETIQUETA_DIM = { aseguradora: 'Aseguradora', ramo: 'Ramo', asesor_id: 'Asesor' };
async function produccion(m) {
  if (!prodDatos || Date.now() - prodHora > 3e5) {
    const filas = await todas(() => sb.from('produccion').select('id,aseguradora,ramo,numero,tipo,prima_neta,creado,asesor_id,persona_id,estado').neq('tipo', 'modificacion').neq('estado', 'no_vigente').gte('creado', '2021-01-01'));
    prodArl = (await sb.from('arl_mes').select('*')).data ?? [];
    prodInformes = (await sb.from('comision_mes').select('anio,mes,compania,linea,prima,comision,cuadra')).data ?? [];
    prodDatos = filas.map((x) => ({ ...x, a: Number(x.creado.slice(0, 4)), m: Number(x.creado.slice(5, 7)) })); // las fechas vienen a medianoche UTC
    prodHora = Date.now();
  }
  const anio = Number(hoy().slice(0, 4));
  prodFiltro ??= { anio, desde: 1, hasta: Number(hoy().slice(5, 7)), comparar: [anio - 1], metrica: 'prima', canceladas: false, aseguradora: '', ramo: '', asesor_id: '' };

// Producción del año más reciente elegido (mismo periodo): por ramo, aseguradora y comercial, contra el año anterior.
async function desgloseProduccion(caja, anio, hasta) {
  const fin = `${anio}-${String(hasta).padStart(2, '0')}-31`, finAnt = `${anio - 1}-${String(hasta).padStart(2, '0')}-31`;
  const filas = await todas(() => sb.from('produccion').select('prima_neta,comision,creado,ramo,aseguradora,asesor_id').gte('creado', `${anio - 1}-01-01`).lt('creado', `${anio + 1}-01-01`).neq('tipo', 'modificacion'));
  const grupos = (campo, nombre = (x) => x || 'Sin dato') => {
    const g = {};
    for (const r of filas) {
      const f = r.creado.slice(0, 10), a = Number(f.slice(0, 4));
      if ((a === anio && f <= fin) || (a === anio - 1 && f <= finAnt)) { const k = nombre(r[campo]); g[k] ??= { [anio]: 0, [anio - 1]: 0, com: 0 }; g[k][a] += +r.prima_neta || 0; if (a === anio) g[k].com += +r.comision || 0; }
    }
    return Object.entries(g).sort((x, y) => y[1][anio] - x[1][anio]);
  };
  const tabla = (t, filas, com) => `<div class="card scroll"><h2>${t} · ene–${MESES[hasta - 1].toLowerCase()}</h2><table><tr><th></th><th class="n">${anio - 1}</th><th class="n">${anio}</th><th class="n">Var.</th>${com ? '<th class="n">Comisión</th>' : ''}</tr>
    ${filas.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="n">${cop(v[anio - 1])}</td><td class="n">${cop(v[anio])}</td><td class="n">${pct(v[anio], v[anio - 1])}</td>${com ? `<td class="n">${cop(v.com)}</td>` : ''}</tr>`).join('') || '<tr><td colspan="5" class="vacio">Sin datos.</td></tr>'}</table></div>`;
  caja.innerHTML = `<div class="grid2">${tabla('Por ramo', grupos('ramo'))}${tabla('Por aseguradora', grupos('aseguradora'))}</div>
    ${tabla('Por comercial', grupos('asesor_id', (id) => (id ? nombreDe(id) : 'Vera (sin comercial)')), true)}`;
}
// Líneas por año (un solo eje, 2px), cuadrícula tenue, cruz y tooltip al pasar el mouse. Leyenda arriba, tabla debajo.
function grafica(caja, series, anios, formato = cop) {
  const W = 720, H = 260, L = 64, R = 16, T = 12, B = 28;
  const max = Math.max(1, ...series.flat().filter((v) => v != null));
  const paso = 10 ** Math.floor(Math.log10(max / 4)), tope = Math.ceil(max / 4 / paso) * paso * 4;
  const x = (i) => L + (i * (W - L - R)) / 11, y = (v) => T + (H - T - B) * (1 - v / tope);
  const linea = (s) => s.map((v, i) => (v == null ? null : `${x(i)},${y(v)}`)).filter(Boolean).join(' ');
  const eje = formato === cop ? millones : (n) => Math.round(n).toLocaleString('es-CO');
  caja.innerHTML = `<div class="fila" style="gap:16px;margin-bottom:6px">${anios.map((a) => `<span class="muted"><span style="display:inline-block;width:14px;height:3px;border-radius:2px;background:${colorAnio(a)};vertical-align:middle;margin-right:6px"></span>${a}</span>`).join('')}</div>
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Comparación por año: ${anios.join(', ')}">
    ${[0, 1, 2, 3, 4].map((k) => `<line x1="${L}" x2="${W - R}" y1="${y((tope * k) / 4)}" y2="${y((tope * k) / 4)}" stroke="#e2e3e8" stroke-width="1"/>
      <text x="${L - 8}" y="${y((tope * k) / 4) + 4}" text-anchor="end" font-size="11" fill="#646a78">${eje((tope * k) / 4)}</text>`).join('')}
    ${MESES.map((mn, i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#646a78">${mn}</text>`).join('')}
    <line class="cruz" y1="${T}" y2="${H - B}" stroke="#646a78" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>
    ${series.map((s, k) => `<polyline points="${linea(s)}" fill="none" stroke="${colorAnio(anios[k])}" stroke-width="${k === series.length - 1 ? 2.5 : 2}" stroke-linejoin="round" stroke-linecap="round"/>`).join('')}
    <g class="puntos"></g>
    ${MESES.map((_, i) => `<rect data-i="${i}" x="${x(i) - (W - L - R) / 22}" y="${T}" width="${(W - L - R) / 11}" height="${H - T - B}" fill="transparent"/>`).join('')}
  </svg><div class="tip card" style="position:absolute;pointer-events:none;padding:10px 12px;margin:0;font-size:13px;display:none;min-width:160px"></div>`;
  const svg = caja.querySelector('svg'), tip = caja.querySelector('.tip'), cruz = caja.querySelector('.cruz'), pts = caja.querySelector('.puntos');
  svg.querySelectorAll('rect[data-i]').forEach((r) => {
    r.onmouseenter = () => {
      const i = Number(r.dataset.i);
      cruz.setAttribute('x1', x(i)); cruz.setAttribute('x2', x(i)); cruz.setAttribute('visibility', 'visible');
      pts.innerHTML = series.map((s, k) => (s[i] == null ? '' : `<circle cx="${x(i)}" cy="${y(s[i])}" r="4.5" fill="${colorAnio(anios[k])}" stroke="#fff" stroke-width="2"/>`)).join('');
      tip.innerHTML = `<b>${MESES[i]}</b>` + series.map((s, k) => `<div style="display:flex;justify-content:space-between;gap:12px"><span><span style="display:inline-block;width:10px;height:3px;background:${colorAnio(anios[k])};vertical-align:middle;margin-right:6px"></span>${anios[k]}</span><b>${s[i] == null ? '—' : formato(s[i])}</b></div>`).join('');
      tip.style.display = 'block';
      const ancho = caja.clientWidth, px = (x(i) / W) * ancho;
      tip.style.left = Math.min(Math.max(px + 12, 0), ancho - tip.offsetWidth) + 'px'; tip.style.top = '30px';
    };
  });
  svg.onmouseleave = () => { tip.style.display = 'none'; cruz.setAttribute('visibility', 'hidden'); pts.innerHTML = ''; };
}

// ───────── Subir pólizas en PDF (Claude las lee con la función caratulas) ─────────
function subirPolizas(caja, alTerminar) {
  caja.innerHTML = `<div class="card"><h2>Subir pólizas en PDF</h2><p class="muted">Para las pólizas que no llegaron por correo. Claude lee cada carátula y la crea con su cliente; si tiene dudas, queda en Por revisar.</p>
    <input type="file" id="pdfs" accept="application/pdf" multiple><ul class="lt" id="subidas"></ul></div>`;
  document.getElementById('pdfs').onchange = async (e) => {
    const lista = document.getElementById('subidas');
    for (const f of e.target.files) {
      const li = document.createElement('li'); li.textContent = `${f.name}: leyendo…`; lista.append(li);
      if (f.size > 15 * 1024 * 1024) { li.textContent = `${f.name}: muy pesado (máx. 15 MB)`; continue; }
      const b64 = await new Promise((ok) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.readAsDataURL(f); });
      const { data } = await sb.functions.invoke('caratulas', { body: { contenido: b64, nombre: f.name } });
      li.textContent = `${f.name}: ` + (data?.omitido === 'repetido' ? 'ya estaba en el CRM' : data?.poliza === false ? 'no parece una póliza'
        : data?.ok ? `${data.datos.aseguradora} ${data.datos.ramo} N.º ${data.datos.numero} · ${data.datos.tomador ?? ''}${data.revisar ? ' · ⚠️ queda en Por revisar' : ' ✅'}` : 'no se pudo leer, intenta de nuevo');
    }
    alTerminar?.();
  };
}

// ───────── Cartera ─────────
// Modelo tipo Salesforce Collections / Zoho Books: por cobrar → compromiso de pago → vencida (en gracia) → pagada o cancelada por mora.
// Edades según la fecha límite de pago de cada póliza; "Cobrar hoy" sigue la cadencia de recordatorios.
const ESTADO_CAR = { sin_dato: 'Sin dato', pendiente: 'Por cobrar', compromiso: '🤝 Compromiso', vencida: '⚠️ Vencida', al_dia: '✅ Pagada', cancelada: '❌ Cancelada por mora' };
const ABIERTA = ['pendiente', 'compromiso', 'vencida'];
// Zonas por días de mora (desde la cuota sin pagar). Cada zona tiene su lista y su nivel de urgencia.
const TRAMOS = [['al_corriente', 'Por cobrar', 'menos de 30 días'], ['d30', 'Cartera vencida', '30 a 40 días'], ['d40', 'Vencida en peligro', '40 a 50 días'], ['d50', 'Riesgo de cancelación', '50 a 60 días'], ['d60', 'Más de 60 días', 'confirmar con la aseguradora']];
const ZONAS = ['d30', 'd40', 'd50'];
const diasMora = (x) => x.mora_desde ? -diasHasta(x.mora_desde) : null;
const tramo = (x) => { if (!ABIERTA.includes(x.cartera) || !x.mora_desde || x.estado !== 'vigente') return ''; const d = diasMora(x); return d < 30 ? 'al_corriente' : d < 40 ? 'd30' : d < 50 ? 'd40' : d <= 60 ? 'd50' : 'd60'; };
// Días frente a la fecha límite en que toca contactar: aviso, recordatorio, vence hoy, llamar, segunda llamada, aviso final.
const CADENCIA = { 15: 'Aviso: vence en 15 días', 5: 'Recordatorio: vence en 5 días', 0: 'Vence hoy', '-1': 'Llamar: venció ayer', '-5': 'Segunda llamada y avisar a gerencia', '-10': 'Aviso final antes de la cancelación' };
const queToca = (x) => {
  if (!ABIERTA.includes(x.cartera)) return '';
  if (x.cartera === 'compromiso' && x.compromiso_fecha === hoy()) return 'Hoy vence el compromiso de pago';
  if (!x.pago_limite) { const t = TRAMOS.find(([k]) => k === tramo(x)); return ZONAS.includes(t?.[0]) && (!x.cartera_contacto || diasDesde(x.cartera_contacto) >= 5) ? `${t[1]}: ${diasMora(x)} días` : ''; }
  const d = diasHasta(x.pago_limite), contactoHoy = x.cartera_contacto && new Date(x.cartera_contacto).toLocaleDateString('en-CA', { timeZone: 'America/Bogota' }) === hoy();
  if (contactoHoy) return '';
  if (CADENCIA[d]) return CADENCIA[d];
  return d < 0 && x.cartera !== 'compromiso' && (!x.cartera_contacto || diasDesde(x.cartera_contacto) >= 5) ? `Vencida hace ${-d} días sin contacto reciente` : '';
};
const valor = (x) => +(x.saldo ?? x.prima_total ?? x.prima_neta ?? 0) || 0;
async function cartera(m, filtro = 'hoy') {
  const pol = await todas(() => sb.from('produccion').select('*').neq('tipo', 'modificacion').or(`vigencia_hasta.gte.${masDias(-90)},cartera.in.(pendiente,compromiso,vencida)`).order('pago_limite', { nullsFirst: false }));
  const [gente, { data: pl }] = await Promise.all([personas(pol, 'id,nombre,telefono,email,no_contactar'), sb.from('plantilla').select('id,nombre,canal,activa').in('nombre', TRAMOS.map((z) => z[1])).eq('activa', true)]);
  const plantillas = pl ?? [];
  const abiertas = pol.filter((x) => ABIERTA.includes(x.cartera)), vigentes = pol.filter((x) => x.vigencia_hasta >= hoy() && x.estado === 'vigente');
  const suma = (xs) => xs.reduce((a, x) => a + valor(x), 0);
  const mes = hoy().slice(0, 7), pagadasMes = pol.filter((x) => x.cartera === 'al_dia' && x.cartera_actualizado?.slice(0, 7) === mes);
  const vencidas = abiertas.filter((x) => x.cartera === 'vencida'), canceladas = pol.filter((x) => x.cartera === 'cancelada' && x.cartera_actualizado?.slice(0, 7) === mes);
  const filtros = { hoy: ['Cobrar hoy', (x) => !!queToca(x)], abiertas: ['Por cobrar', (x) => ABIERTA.includes(x.cartera)], compromiso: ['Compromisos de pago', (x) => x.cartera === 'compromiso'],
    sin_dato: ['Vigentes sin dato', (x) => x.cartera === 'sin_dato' && x.vigencia_hasta >= hoy() && x.estado === 'vigente'], al_dia: ['Pagadas', (x) => x.cartera === 'al_dia'], cancelada: ['Canceladas por mora', (x) => x.cartera === 'cancelada'],
    ...Object.fromEntries(TRAMOS.map(([k, t, d]) => [k, [`${t} · ${d}`, (x) => tramo(x) === k]])) };
  const lista = pol.filter(filtros[filtro]?.[1] ?? filtros.hoy[1]);
  const fila = (x) => { const p = gente[x.persona_id], d = x.pago_limite ? diasHasta(x.pago_limite) : null, toca = queToca(x);
    return `<tr><td>${p ? `<a href="#" data-p="${p.id}"><b>${esc(p.nombre)}</b></a>${p.telefono ? `<br><a href="https://wa.me/57${esc(p.telefono)}" target="_blank" rel="noopener" class="muted">WhatsApp ${esc(p.telefono)}</a>` : ''}` : '<span class="muted">Sin cliente</span>'}
      ${toca ? `<br><span class="chip alerta">${esc(toca)}</span>` : ''}</td>
      <td>${esc(x.aseguradora)} ${esc(x.ramo)}<br><span class="muted">N.º ${esc(x.numero)}${x.cartera_fuente ? ' · ' + esc(x.cartera_fuente) : ''}</span></td>
      <td><input type="date" data-lim="${x.id}" value="${esc(x.pago_limite)}" style="padding:4px 8px">${d != null && ABIERTA.includes(x.cartera) ? `<br><span class="${d < 0 ? 'vencida' : 'muted'}">${d < 0 ? `hace ${-d} días` : d === 0 ? 'hoy' : `en ${d} días`}</span>` : ''}</td>
      <td class="n"><input data-sal="${x.id}" value="${esc(x.saldo ?? '')}" placeholder="${esc(x.prima_total ?? x.prima_neta ?? '')}" inputmode="numeric" style="width:120px;padding:4px 8px;text-align:right"></td>
      <td>${selEstado(ESTADO_CAR, x.cartera, `data-car="${x.id}"`)}<input type="date" data-com="${x.id}" value="${esc(x.compromiso_fecha)}" title="Fecha del compromiso de pago" style="padding:4px 8px;margin-top:4px;${x.cartera === 'compromiso' ? '' : 'display:none'}"></td>
      <td><div class="fila"><button class="s" data-g="${x.id}">Guardar</button><button class="s" data-c="${x.id}" title="Registrar que se contactó al cliente hoy">📞 Contactado</button></div>
        ${x.cartera_contacto ? `<span class="muted">Último contacto ${fecha(x.cartera_contacto)}</span>` : ''}</td></tr>`; };
  m.innerHTML = `<div class="fila" style="justify-content:space-between"><h1>Cartera</h1>
      <select id="filtro">${Object.entries(filtros).map(([k, [t]]) => `<option value="${k}"${k === filtro ? ' selected' : ''}>${t} (${pol.filter(filtros[k][1]).length})</option>`).join('')}</select></div>
    <div class="kpis"><div class="kpi"><small>Por cobrar</small><strong>${cop(suma(abiertas))}</strong><small>${abiertas.length} pólizas</small></div>
      <div class="kpi"><small>Vencida</small><strong class="down">${cop(suma(vencidas))}</strong><small>${abiertas.length ? Math.round(suma(vencidas) / (suma(abiertas) || 1) * 100) : 0}% de lo que se debe · ${vencidas.length} pólizas</small></div>
      <div class="kpi"><small>Pagadas este mes</small><strong class="up">${pagadasMes.length}</strong><small>Compromisos activos: ${abiertas.filter((x) => x.cartera === 'compromiso').length}</small></div>
      <div class="kpi"><small>Canceladas por mora este mes</small><strong class="${canceladas.length ? 'down' : ''}">${canceladas.length}</strong><small>Prima perdida ${cop(canceladas.reduce((a, x) => a + (+x.prima_neta || 0), 0))}</small></div></div>
    <div class="card"><h2>Edad de la cartera</h2><div class="flujo">${TRAMOS.map(([k, t, d], i) => { const xs = abiertas.filter((x) => tramo(x) === k);
      return `${i ? '<span class="flecha">→</span>' : ''}<button class="paso ${xs.length ? (i < 1 ? 'curso' : 'alerta') : ''}" data-f="${k}" aria-pressed="${filtro === k}"><small>${t} · ${d}</small><strong>${xs.length}</strong><small>${cop(suma(xs))}</small></button>`; }).join('')}</div>
      <p class="muted" style="margin-bottom:0">${vigentes.filter((x) => x.cartera === 'sin_dato').length} pólizas vigentes aún sin dato de pago: se llenan con el archivo semanal de cada aseguradora.
        Los días de mora se estiman desde la cuota sin pagar (inicio de vigencia más cuotas pagadas) hasta tener la fecha límite real. Al registrar un compromiso, los avisos se pausan hasta esa fecha.</p></div>
    <div class="zonas">${ZONAS.map((k) => { const [, t, d] = TRAMOS.find((z) => z[0] === k), xs = abiertas.filter((x) => tramo(x) === k).sort((a, b) => valor(b) - valor(a));
      return `<section class="zona ${k}"><div class="fila" style="justify-content:space-between"><h2 style="margin:0">${t}</h2><span class="muted">${d}</span></div>
        <p class="zona-total"><strong>${cop(suma(xs))}</strong> <span class="muted">${xs.length} pólizas</span></p>
        ${xs.slice(0, 6).map((x) => { const p = gente[x.persona_id]; return `<div class="zona-fila"><div>${p ? `<a href="#" data-p="${p.id}">${esc(p.nombre)}</a>` : 'Sin cliente'}<br><span class="muted">${esc(x.aseguradora)} ${esc(x.ramo)} · ${diasMora(x)} días</span></div><span>${cop(valor(x))}</span></div>`; }).join('') || '<p class="vacio">Nadie en esta zona.</p>'}
        <div class="fila">${xs.length > 6 ? `<button class="s" data-f="${k}">Ver las ${xs.length}</button>` : ''}${xs.length && yo.rol !== 'junta' ? `<button class="b" data-zona="${k}">Enviar mensaje</button>` : ''}</div><p class="muted" data-zmsg="${k}" style="margin:0"></p></section>`; }).join('')}</div>
    ${yo.rol === 'gerente' ? `<div class="card"><h2>Archivo semanal de la aseguradora</h2>
      <p class="muted">Sube el estado de cartera (Excel o CSV) que envía cada aseguradora. El CRM une cada fila por número de póliza: saldo 0 = pagada; si pasó la fecha límite queda vencida.</p>
      <div class="fila"><input type="file" id="carArchivo" accept=".xlsx,.xls,.csv"><input id="carFuente" placeholder="Aseguradora (ej. SURA)" style="width:200px"></div>
      <div id="carMapa"></div><p id="carMsg" class="muted"></p></div>` : ''}
    <div class="card scroll"><h2>${esc(filtros[filtro]?.[0] ?? 'Cobrar hoy')} · ${lista.length}</h2>${lista.length ? `<table><tr><th>Cliente</th><th>Póliza</th><th>Fecha límite</th><th class="n">Saldo</th><th>Estado</th><th></th></tr>
      ${lista.slice(0, 300).map(fila).join('')}</table>${lista.length > 300 ? `<p class="muted">Se muestran 300 de ${lista.length}.</p>` : ''}`
      : `<p class="vacio">${filtro === 'hoy' ? 'Nadie para cobrar hoy. 🎉' : 'Nada por aquí.'}</p>`}</div>`;
  document.getElementById('filtro').onchange = (e) => cartera(m, e.target.value);
  m.querySelectorAll('[data-f]').forEach((b) => b.onclick = () => cartera(m, b.dataset.f === filtro ? 'abiertas' : b.dataset.f));
  m.querySelectorAll('[data-car]').forEach((s) => s.onchange = () => m.querySelector(`[data-com="${s.dataset.car}"]`).style.display = s.value === 'compromiso' ? '' : 'none');
  const guardar = async (id, contacto) => {
    const sal = m.querySelector(`[data-sal="${id}"]`).value.replace(/\D/g, ''), estado = m.querySelector(`[data-car="${id}"]`).value, com = m.querySelector(`[data-com="${id}"]`).value || null;
    if (estado === 'compromiso' && !com) { alert('Escribe la fecha en que el cliente se comprometió a pagar.'); return false; }
    const { error } = await sb.rpc('gestionar_cartera', { p_id: id, p_estado: estado, p_pago_limite: m.querySelector(`[data-lim="${id}"]`).value || null, p_saldo: sal ? Number(sal) : null, p_compromiso: com, p_contacto: contacto });
    if (error) { alert('No se pudo guardar: ' + error.message); return false; }
    return true;
  };
  m.querySelectorAll('[data-g]').forEach((b) => b.onclick = async () => { b.disabled = true; if (await guardar(b.dataset.g, false)) b.textContent = 'Guardado ✓'; b.disabled = false; });
  m.querySelectorAll('[data-c]').forEach((b) => b.onclick = async () => { b.disabled = true; if (await guardar(b.dataset.c, true)) cartera(m, filtro); });
  // Un mensaje por cliente con todas sus pólizas de la zona. WhatsApp si la plantilla está aprobada y hay celular; si no, correo.
  m.querySelectorAll('[data-zona]').forEach((b) => b.onclick = async () => {
    const k = b.dataset.zona, nombre = TRAMOS.find((z) => z[0] === k)[1], msg = m.querySelector(`[data-zmsg="${k}"]`);
    const de = (canal) => plantillas.find((t) => t.nombre === nombre && t.canal === canal);
    const porCliente = {};
    abiertas.filter((x) => tramo(x) === k).forEach((x) => (porCliente[x.persona_id] ??= []).push(x));
    const lista = Object.entries(porCliente).map(([id, xs]) => { const p = gente[id], t = p?.telefono && de('whatsapp') || p?.email && de('correo'); return { p, xs, t }; });
    const listos = lista.filter(({ p, xs, t }) => t && !p.no_contactar && xs.every((x) => !x.cartera_contacto || diasDesde(x.cartera_contacto) >= 5));
    if (!listos.length) return msg.textContent = 'Nadie para enviar: sin correo o celular, no contactar, o contactados hace menos de 5 días.';
    if (!confirm(`¿Enviar "${nombre}" a ${listos.length} clientes? Se omiten ${lista.length - listos.length} (sin datos, no contactar o contactados hace poco). Los días de mora son estimados: revisa la lista antes de enviar.`)) return;
    b.disabled = true; let ok = 0, fallos = 0;
    for (const { p, xs, t } of listos) {
      msg.textContent = `Enviando… ${ok + fallos + 1} de ${listos.length}`;
      const mensaje = xs.map((x) => `${x.aseguradora} ${x.ramo} N.º ${x.numero}`).join('; ');
      const { data } = await sb.functions.invoke('enviar', { body: { accion: 'enviar', persona_id: p.id, plantilla_id: t.id, mensaje } });
      if (!data?.ok) { fallos++; if (/tope|l[ií]mite/i.test(data?.error ?? '')) { msg.textContent = data.error; break; } continue; }
      ok++;
      for (const x of xs) await sb.rpc('gestionar_cartera', { p_id: x.id, p_estado: x.cartera, p_pago_limite: x.pago_limite, p_saldo: x.saldo, p_compromiso: x.compromiso_fecha, p_contacto: true });
    }
    msg.textContent = `Listo: ${ok} enviados${fallos ? `, ${fallos} no se pudieron enviar` : ''}.`;
    b.disabled = false;
  });
  document.getElementById('carArchivo')?.addEventListener('change', (e) => leerCartera(e.target.files[0], m, filtro));
  enlazar(m);
}

// Lee el Excel o CSV de la aseguradora, adivina las columnas (el gerente puede corregirlas) y lo importa por lotes.
const fechaISO = (v) => {
  const s = String(v ?? '').trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const d = s.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})/);
  if (d) return `${d[3].length === 2 ? '20' + d[3] : d[3]}-${d[2].padStart(2, '0')}-${d[1].padStart(2, '0')}`;
  if (/^\d{5}(\.\d+)?$/.test(s)) return new Date(Date.UTC(1899, 11, 30) + Number(s) * 864e5).toISOString().slice(0, 10); // número de serie de Excel
  return '';
};
async function leerCartera(archivo, m, filtro) {
  const msg = document.getElementById('carMsg'), caja = document.getElementById('carMapa');
  if (!archivo) return;
  msg.textContent = 'Leyendo el archivo…';
  let filas;
  try {
    if (/\.csv$/i.test(archivo.name)) filas = leerCsv(await archivo.text());
    else {
      const XLSX = await import('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm');
      const libro = XLSX.read(await archivo.arrayBuffer(), { cellDates: false });
      filas = XLSX.utils.sheet_to_json(libro.Sheets[libro.SheetNames[0]], { defval: '', raw: true });
      filas = filas.map((r) => Object.fromEntries(Object.entries(r).map(([k, v]) => [k.trim().toLowerCase(), String(v)])));
    }
  } catch (err) { return msg.textContent = 'No se pudo leer: ' + (err?.message || err); }
  if (!filas.length) return msg.textContent = 'El archivo está vacío.';
  const cols = Object.keys(filas[0]);
  const adivina = (re) => cols.find((c) => re.test(c)) ?? '';
  const mapa = { numero: adivina(/p[oó]liza|n[uú]mero|^no\.?$|certificado/), saldo: adivina(/saldo|pendiente|valor|deuda|prima/), pago_limite: adivina(/l[ií]mite|vencimiento|vence|fecha.*pago|pago.*fecha/) };
  if (!document.getElementById('carFuente').value) document.getElementById('carFuente').value = archivo.name.replace(/\.[^.]+$/, '').slice(0, 40);
  const sel = (k, t) => `<label class="muted">${t} <select data-mapa="${k}"><option value="">—</option>${cols.map((c) => `<option${c === mapa[k] ? ' selected' : ''}>${esc(c)}</option>`).join('')}</select></label>`;
  caja.innerHTML = `<p class="muted" style="margin:12px 0 6px">${filas.length.toLocaleString('es-CO')} filas. Revisa qué columna es cada dato:</p>
    <div class="fila">${sel('numero', 'N.º de póliza')}${sel('saldo', 'Saldo por pagar')}${sel('pago_limite', 'Fecha límite')}<button class="b" id="carImportar" type="button">Importar cartera</button></div>`;
  msg.textContent = '';
  document.getElementById('carImportar').onclick = async (e) => {
    const k = Object.fromEntries([...caja.querySelectorAll('[data-mapa]')].map((s) => [s.dataset.mapa, s.value]));
    if (!k.numero || !k.saldo) return msg.textContent = 'Elige al menos la columna del número de póliza y la del saldo.';
    e.target.disabled = true;
    const fuente = document.getElementById('carFuente').value.trim() || archivo.name;
    const datos = filas.map((r) => ({ numero: r[k.numero], saldo: String(r[k.saldo]).replace(/[.,]\d{1,2}$/, ''), pago_limite: k.pago_limite ? fechaISO(r[k.pago_limite]) : '' })).filter((r) => r.numero);
    let unidas = 0; const sinUnir = [];
    for (let i = 0; i < datos.length; i += 500) {
      msg.textContent = `Importando… ${Math.min(i + 500, datos.length)} de ${datos.length}`;
      const { data, error } = await sb.rpc('importar_cartera', { filas: datos.slice(i, i + 500), fuente: `${fuente} · ${fecha(new Date())}` });
      if (error) { e.target.disabled = false; return msg.textContent = 'Se detuvo: ' + error.message; }
      unidas += data.unidas; sinUnir.push(...data.sin_unir);
    }
    caja.innerHTML = sinUnir.length ? `<details><summary>${sinUnir.length} filas sin póliza en el CRM (revísalas o sube la carátula)</summary>
      <p class="muted">${sinUnir.slice(0, 200).map((r) => esc(r.numero)).join(' · ')}</p></details>` : '';
    msg.textContent = `Listo: ${unidas} pólizas actualizadas${sinUnir.length ? `, ${sinUnir.length} sin unir` : ''}.`;
    setTimeout(() => cartera(m, 'abiertas'), 1500);
  };
}

// ───────── Clientes ─────────
const POR_PAGINA = 50;
// Cliente = tiene al menos una póliza vigente. Contacto = no la tiene (prospectos, WhatsApp, excliente).
const contactos = (m) => clientes(m, { q: '', asesor: '', operativo: '', estado: 'prospectos', orden: 'reciente', pagina: 0 });
async function clientes(m, f = { q: '', asesor: '', operativo: '', estado: 'vigentes', orden: 'nombre', pagina: 0 }) {
  const esContacto = f.estado === 'prospectos', nombreLista = esContacto ? 'Contactos' : 'Clientes';
  let c = sb.from('cliente_resumen').select('*', { count: 'exact' });
  const limpio = f.q.replace(/[,()%*]/g, ' ').trim();
  if (limpio) c = c.or(`nombre.ilike.%${limpio}%,cedula.ilike.%${limpio}%,telefono.ilike.%${limpio}%,email.ilike.%${limpio}%`);
  const quien = (campo, v) => { if (v === 'yo') c = c.eq(campo, yo.id); else if (v === 'sin') c = c.is(campo, null); else if (v) c = c.eq(campo, v); };
  quien('asesor_id', f.asesor); quien('operativo_id', f.operativo);
  if (f.estado === 'vigentes') c = c.gt('polizas_vigentes', 0); else if (f.estado === 'prospectos') c = c.eq('polizas_vigentes', 0);
  else if (f.estado === 'vencen') c = c.gte('proximo_vencimiento', hoy()).lte('proximo_vencimiento', masDias(60));
  c = { nombre: () => c.order('nombre'), prima: () => c.order('prima_vigente', { ascending: false }), vence: () => c.order('proximo_vencimiento', { nullsFirst: false }) }[f.orden]?.() ?? c.order('creado', { ascending: false });
  const { data, count } = await c.range(f.pagina * POR_PAGINA, f.pagina * POR_PAGINA + POR_PAGINA - 1);
  const seg = {};
  const ids = (data ?? []).filter((p) => p.polizas_vigentes).map((p) => p.id);
  if (ids.length) (await sb.from('poliza').select('persona_id,ramo,vigencia_hasta').in('persona_id', ids).gte('vigencia_hasta', hoy()).neq('tipo', 'modificacion').eq('estado', 'vigente').order('vigencia_hasta')).data
    ?.forEach((x) => (seg[x.persona_id] ??= []).push(x));
  const total = count ?? 0, paginas = Math.max(1, Math.ceil(total / POR_PAGINA));
  const sel = (id, actual, primeras, opciones) => `<select id="${id}">${primeras}<option value="yo"${actual === 'yo' ? ' selected' : ''}>Yo</option><option value="sin"${actual === 'sin' ? ' selected' : ''}>Sin asignar</option>${opciones(actual)}</select>`;
  m.innerHTML = `<div class="fila" style="justify-content:space-between"><h1>${nombreLista}</h1><button class="b" id="nuevo">+ Nuevo ${esContacto ? 'contacto' : 'cliente'}</button></div>

      <div class="fila" style="margin-top:10px">

// Perfil del cliente: datos de contacto, sus seguros con Vera (vigencia de cada póliza), oportunidades e historial.
const RAMO_ICONO = { Autos: '🚗', SOAT: '🚗', Salud: '🩺', Vida: '❤️', Hogar: '🏠', Empresarial: '🏢', Cumplimiento: '📄', Mascotas: '🐾' };
function tarjetaSeguro(x) {
  const ini = x.vigencia_desde, fin = x.vigencia_hasta, dias = fin ? diasHasta(fin) : null;
  const total = ini && fin ? diasHasta(fin) - diasHasta(ini) : 0;
  const pct = total > 0 ? Math.min(100, Math.max(0, Math.round(-diasHasta(ini) / total * 100))) : 0;
  const clase = x.estado !== 'vigente' ? 'fin' : dias == null ? '' : dias < 0 ? 'fin' : dias <= 30 ? 'vence' : dias <= 90 ? 'pronto' : '';
  const estado = x.estado === 'cancelada' ? 'Cancelada' : x.estado === 'no_vigente' ? 'No vigente' : dias == null ? 'Sin fecha de fin' : dias < 0 ? `Terminó hace ${-dias} días` : dias === 0 ? 'Vence hoy' : `Vence en ${dias} días`;
  return `<div class="seguro ${clase}"><div class="fila" style="justify-content:space-between"><b>${RAMO_ICONO[x.ramo] ?? '🛡️'} ${esc(x.ramo)}</b><span class="muted">${esc(x.aseguradora)}</span></div>
    <div class="fila" style="justify-content:space-between"><span class="muted">Póliza N.º ${esc(x.numero)}</span>${x.pdf_path ? `<a href="#" data-pdf="${esc(x.pdf_path)}">📄 Ver póliza</a>` : '<span class="muted">Sin PDF</span>'}</div>
    <div class="barra"><i style="width:${pct}%"></i></div>
    <div class="fila" style="justify-content:space-between"><span class="muted">${fechaLarga(ini)} → ${fechaLarga(fin)}</span><span class="${clase === 'vence' ? 'vencida' : 'muted'}">${estado}</span></div>
    <div class="fila" style="justify-content:space-between;margin-top:6px"><span>${x.prima_neta ? cop(x.prima_neta) + ' <span class="muted">prima neta</span>' : ''}</span><span class="muted">${dias != null && dias >= 0 ? ESTADO_REN[x.renovacion] ?? '' : ''}</span></div></div>`;
}

  document.getElementById('ver').onclick = async () => {
    const { data, error } = await sb.functions.invoke('enviar', { body: { accion: 'vista', ...cuerpo() } });
    if (error || !data?.ok) return est.textContent = 'No se pudo generar la vista previa.';
    const prev = document.getElementById('prev');

      prev.innerHTML = `<p style="margin:14px 0 0"><b>Asunto:</b> ${esc(data.asunto)}</p><iframe class="vista" sandbox title="Vista previa del correo"></iframe>`;
      prev.querySelector('iframe').srcdoc = data.html;
    } else prev.innerHTML = `<p class="muted" style="margin-top:12px">Variables que se envían en la plantilla:</p><ul class="lt">${data.textos.map((t) => `<li>${esc(t)}</li>`).join('') || '<li>Sin variables</li>'}</ul>`;
  };
  document.getElementById('mandar').onclick = async (e) => {
    if (!confirm(`¿Enviar "${document.getElementById('pl').selectedOptions[0].text}" a ${destino}?`)) return;
    e.target.disabled = true; est.textContent = 'Enviando…';

    if (error || !data?.ok) { e.target.disabled = false; return est.textContent = 'No se envió: ' + (data?.error || 'error de conexión'); }
    ficha(m, p.id);
  };
}

function leerCsv(texto) {

  for (let i = 0; i < texto.length; i++) {
    const ch = texto[i];
    if (q) { if (ch === '"' && texto[i + 1] === '"') { c += '"'; i++; } else if (ch === '"') q = false; else c += ch; }
    else if (ch === '"') q = true; else if (ch === ',') { f.push(c); c = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && texto[i + 1] === '\n') i++; f.push(c); if (f.some((x) => x.trim())) filas.push(f); f = []; c = ''; }
    else c += ch;
  }
  f.push(c); if (f.some((x) => x.trim())) filas.push(f);
  const cab = filas.shift().map((h) => h.replace(/^\uFEFF/, '').trim().toLowerCase());
  return filas.map((x) => Object.fromEntries(cab.map((h, i) => [h, (x[i] ?? '').trim()])));
}
async function importarCsv(archivo, prevalece, est) {
  if (!archivo) return;
  const filas = leerCsv(await archivo.text());
  const esPoliza = filas.length && 'numero' in filas[0] && 'aseguradora' in filas[0];
  // Solo número + primas/asesor (reporte de pólizas vigentes de Data Finanzas): completa pólizas que ya existen.
  if (filas.length && 'numero' in filas[0] && !esPoliza && 'prima_neta' in filas[0]) return completarPolizas(filas, est);
  // Conciliación de cartera de Data Finanzas (cuotas y primas pagadas por póliza).
  if (filas.length && 'cuotas_total' in filas[0]) return completarPolizas(filas, est, 'conciliar_cartera', 'pólizas con cartera actualizada');
  if (!filas.length) return est.textContent = 'El archivo está vacío.';
  est.textContent = '';
  if (!confirm(`¿Importar ${filas.length.toLocaleString('es-CO')} ${esPoliza ? 'pólizas' : 'clientes'} de "${archivo.name}"?${!esPoliza && prevalece ? ' Los datos de este archivo reemplazarán los guardados.' : ''}`)) return;
  const tot = { nuevos: 0, actualizados: 0, errores: 0 }, lote = esPoliza ? 300 : 500;
  for (let i = 0; i < filas.length; i += lote) {
    const parte = filas.slice(i, i + lote);
    if (esPoliza) parte.forEach((r) => { try { r.datos = r.datos ? JSON.parse(r.datos) : null; } catch { r.datos = null; } });
    const { data, error } = esPoliza ? await sb.rpc('importar_polizas', { filas: parte }) : await sb.rpc('importar_personas', { filas: parte, prevalece });
    if (error) { est.textContent = `Se detuvo en la fila ${i + 1}: ${error.message}`; return; }
    if (!esPoliza && ['tipo_doc', 'genero', 'email2', 'telefono2', 'empresa'].some((k) => k in parte[0])) await sb.rpc('completar_persona', { filas: parte });
    tot.nuevos += data.nuevos ?? data.nuevas; tot.actualizados += data.actualizados ?? data.actualizadas; tot.errores += data.errores;
    est.textContent = `Importando… ${Math.min(i + lote, filas.length).toLocaleString('es-CO')} de ${filas.length.toLocaleString('es-CO')}`;
  }
  if (esPoliza) await sb.rpc('asignar_codigos');
  est.textContent = `Listo: ${tot.nuevos} nuevos, ${tot.actualizados} actualizados, ${tot.errores} filas sin datos suficientes.`;
}

async function completarPolizas(filas, est, rpc = 'completar_polizas', que = 'pólizas completadas con prima y asesor') {
  let unidas = 0; const sinUnir = [];
  for (let i = 0; i < filas.length; i += 300) {
    const parte = filas.slice(i, i + 300).map((r) => { try { return { ...r, datos: r.datos ? JSON.parse(r.datos) : null }; } catch { return { ...r, datos: null }; } });
    const { data, error } = await sb.rpc(rpc, { filas: parte });
    if (error) return est.textContent = `Se detuvo en la fila ${i + 1}: ${error.message}`;
    unidas += data.unidas; sinUnir.push(...data.sin_unir);
    est.textContent = `Completando primas… ${Math.min(i + 300, filas.length)} de ${filas.length}`;
  }
  est.textContent = `Listo: ${unidas} ${que}${sinUnir.length ? `; sin encontrar: ${sinUnir.slice(0, 30).join(', ')}` : ''}.`;
}

    <div class="card scroll"><h2>Comisiones (%)</h2><table><tr><th>Aseguradora</th><th>Ramo</th><th class="n">%</th></tr>
      ${(tar ?? []).map((t) => `<tr><td>${esc(t.aseguradora)}</td><td>${esc(t.ramo)}</td><td class="n">${t.pct}</td></tr>`).join('') || '<tr><td colspan="3" class="vacio">Sin tarifas.</td></tr>'}</table>
      <form class="fila" id="fc" style="margin-top:12px"><input name="aseguradora" required placeholder="Aseguradora" size="12"><input name="ramo" required placeholder="Ramo" size="10">
      <input name="pct" required type="number" step="0.01" min="0" max="100" placeholder="%" style="width:80px"><button class="b">Guardar</button></form>
      <p class="muted">Usa los mismos nombres que en las pólizas (ej. SURA / Autos). Guardar de nuevo la misma pareja actualiza el %.</p></div></div>
    <div class="card"><h2>Contraseñas</h2><p class="muted">Asigna o cambia la contraseña de quien la necesite y compártesela en persona. Queda lista para entrar de inmediato.
      La junta entra con el usuario <b>junta</b>: ve Producción, Financiero, Renovaciones y Cartera, sin clientes y sin poder cambiar nada.</p>
      <form class="fila" id="fJunta"><select name="quien">${equipo.filter((e) => e.activo && e.rol !== 'comercial').map((e) => `<option value="${esc(e.email)}">${esc(e.nombre)} · ${esc(e.email)}</option>`).join('')}<option value="junta">Junta (usuario: junta)</option></select>
        <input type="password" name="clave" required minlength="10" placeholder="Contraseña (mín. 10, letras y números)" autocomplete="new-password" style="flex:1;min-width:220px">
        <button class="b">Guardar contraseña</button><span id="msgJunta" class="muted"></span></form></div>
    <div class="card"><h2>Carátulas desde Outlook</h2><p class="muted">Conecta el buzón de Outlook para que Claude lea solas las carátulas (y luego los estados de cartera) que llegan por correo.</p>
      <ol class="muted" style="padding-left:18px"><li>Entra a <a href="https://portal.azure.com/#cloudshell/" target="_blank" rel="noopener">Azure Cloud Shell</a> con la cuenta de Vera (elige Bash).</li>
        <li>Pega este comando y presiona Enter: <code>bash &lt;(curl -s https://raw.githubusercontent.com/feliperpovera/VeraSegurosV2/main/supabase/azure-caratulas.sh)</code></li>
        <li>Cuando pida la clave, pega esta (es privada):</li></ol>
      <div class="fila"><input id="carKey" type="password" readonly value="${esc(carKey ?? '')}" style="flex:1;min-width:260px"><button class="s" id="carCopiar" type="button">Copiar clave</button></div>
      <p class="muted">Usa la conexión de Outlook de info@ que ya existe en Azure. Al terminar, envía un PDF de prueba a info@: en unos 3 minutos aparece en Producción o en Por revisar.</p></div>
    <div class="card"><h2>WhatsApp (Woztell) → CRM</h2><p class="muted">En Woztell, en el canal de WhatsApp → Webhook de mensajes entrantes ("Inbound Messages"), pega esta dirección. Cada WhatsApp que llegue crea o encuentra al cliente por su celular, abre su oportunidad en Estrategia digital y queda en su historial. Es privada: no la compartas.</p>
      <div class="fila"><input id="wzUrl" readonly value="${esc(wzUrl ?? '')}" style="flex:1;min-width:260px"><button class="s" id="wzCopiar" type="button">Copiar</button></div></div>
    <div class="card"><h2>Importar clientes o pólizas (CSV)</h2>
      <p class="muted">Clientes: columnas nombre, cedula, telefono, email, ciudad, direccion, nacimiento, asesor (correo), notas… · Pólizas: aseguradora, ramo, numero, cedula, vigencia_desde, vigencia_hasta, prima_neta. Se une por cédula y celular; nunca se duplica.</p>
      <div class="fila"><input type="file" id="csv" accept=".csv,text/csv"><label class="muted"><input type="checkbox" id="prevalece"> Este archivo prevalece (reemplaza datos guardados)</label>
        <button class="b" id="importar" type="button">Importar archivo</button></div>
      <p id="imp" class="muted"></p></div>
    <div class="card scroll"><h2>Plantillas</h2><table><tr><th>Canal</th><th>Nombre</th><th>Estado</th><th></th></tr>
      ${(pls ?? []).map((x) => `<tr><td>${x.canal === 'correo' ? '✉️ Correo' : '💬 WhatsApp'}</td><td>${esc(x.nombre)}</td><td>${x.activa ? 'Activa' : 'Inactiva'}</td>
        <td class="fila"><button class="s" data-ed="${x.id}">Editar</button><button class="s" data-act="${x.id}" data-a="${x.activa}">${x.activa ? 'Desactivar' : 'Activar'}</button></td></tr>`).join('')}</table>
      <form id="fp" style="margin-top:16px"><input type="hidden" name="pid"><div class="fila">
        <select name="canal"><option value="correo">✉️ Correo</option><option value="whatsapp">💬 WhatsApp</option></select>
        <input name="nombre" required placeholder="Nombre de la plantilla" style="flex:1"></div>
        <div data-solo="correo"><input name="asunto" placeholder="Asunto (puede usar {{nombre}})" style="width:100%;margin-top:8px">
          <textarea name="cuerpo" placeholder="Texto o HTML del correo. Pega aquí el HTML de tus plantillas de Outlook." style="margin-top:8px;min-height:180px"></textarea></div>
        <div data-solo="whatsapp" class="oculto fila" style="margin-top:8px"><input name="meta_nombre" placeholder="Nombre exacto aprobado en Meta (ej. retomaed)" style="flex:1">
          <input name="variables" placeholder="Variables en orden: nombre, asesor" style="flex:1"></div>
        <p class="muted">Variables: {{nombre}} {{nombre_completo}} {{asesor}} {{asesor_correo}} {{mensaje}}. Si el HTML empieza por &lt;html, se envía tal cual; si no, va dentro del diseño de Vera.</p>
        <div class="fila"><button class="b">Guardar plantilla</button><button type="button" class="s" id="limpiar">Nueva</button></div></form></div>`;
  document.getElementById('fJunta').onsubmit = async (e) => {
    e.preventDefault();
    const quien = e.target.quien.value;
    const { data } = await sb.functions.invoke('cuentas', { body: { ...(quien === 'junta' ? { usuario: 'junta' } : { email: quien }), clave: e.target.clave.value } });
    document.getElementById('msgJunta').textContent = data?.ok ? 'Listo ✓' : (data?.error || 'No se pudo guardar');
    if (data?.ok) e.target.reset();
  };
  document.getElementById('carCopiar').onclick = async (e) => { await navigator.clipboard.writeText(document.getElementById('carKey').value); e.target.textContent = 'Copiada ✓'; };
  document.getElementById('wzCopiar').onclick = async (e) => { await navigator.clipboard.writeText(document.getElementById('wzUrl').value); e.target.textContent = 'Copiada ✓'; };
  document.getElementById('importar').onclick = async (e) => {
    const est = document.getElementById('imp'), archivo = document.getElementById('csv').files[0];
    if (!archivo) return est.textContent = 'Primero elige el archivo.';
    e.target.disabled = true; est.textContent = 'Leyendo el archivo…';
    try { await importarCsv(archivo, document.getElementById('prevalece').checked, est); }
    catch (err) { est.textContent = 'No se pudo importar: ' + (err?.message || err); }
    e.target.disabled = false;
  };
  const fp = document.getElementById('fp');
  const modo = () => fp.querySelectorAll('[data-solo]').forEach((d) => d.classList.toggle('oculto', d.dataset.solo !== fp.canal.value));
  fp.canal.onchange = modo;
  document.getElementById('limpiar').onclick = () => { fp.reset(); fp.pid.value = ''; modo(); };
  m.querySelectorAll('[data-ed]').forEach((b) => b.onclick = () => {
    const x = pls.find((y) => y.id === b.dataset.ed);
    for (const k of ['canal', 'nombre', 'asunto', 'cuerpo', 'meta_nombre']) fp[k].value = x[k] ?? '';
    fp.pid.value = x.id;
    fp.variables.value = (x.variables ?? []).join(', ');
    modo(); fp.scrollIntoView({ behavior: 'smooth' });
  });
  m.querySelectorAll('[data-act]').forEach((b) => b.onclick = async () => { await sb.from('plantilla').update({ activa: b.dataset.a !== 'true' }).eq('id', b.dataset.act); ajustes(m); });
  fp.onsubmit = async (e) => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(fp));
    const fila = { canal: d.canal, nombre: d.nombre.trim(), asunto: d.canal === 'correo' ? d.asunto.trim() : null, cuerpo: d.canal === 'correo' ? d.cuerpo : null,
      meta_nombre: d.canal === 'whatsapp' ? d.meta_nombre.trim() : null, variables: d.canal === 'whatsapp' ? d.variables.split(',').map((v) => v.trim()).filter(Boolean) : [] };
    const { error } = d.pid ? await sb.from('plantilla').update(fila).eq('id', d.pid) : await sb.from('plantilla').insert(fila);
    if (error) return alert(error.code === '23514' ? 'Faltan datos: el correo necesita asunto y texto; WhatsApp necesita el nombre de Meta.' : error.message);
    ajustes(m);
  };
  document.getElementById('fe').onsubmit = async (e) => {

    ajustes(m);
  };
  document.getElementById('fc').onsubmit = async (e) => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target));
    const { error } = await sb.from('comision_tarifa').upsert({ aseguradora: d.aseguradora.trim(), ramo: d.ramo.trim(), pct: Number(d.pct) });

    ajustes(m);
  };
  m.querySelectorAll('[data-cod]').forEach((i) => i.onchange = async () => {
    const { error } = await sb.from('empleado').update({ codigo: i.value.trim().toUpperCase() || null }).eq('id', i.dataset.cod);
    if (error) return alert(error.code === '23505' ? 'Ese código ya lo tiene otra persona.' : error.message);
    const { data } = await sb.rpc('asignar_codigos');
    if (data) alert(`Asignados: ${data.polizas_asesor + data.polizas_operativo} pólizas y ${data.clientes_asesor + data.clientes_operativo} clientes.`);
  });
  m.querySelectorAll('[data-e]').forEach((b) => b.onclick = async () => {
    await sb.from('empleado').update({ activo: b.dataset.a !== 'true' }).eq('id', b.dataset.e);
    ajustes(m);
  });
}

// Una sola entrada: sesión guardada al cargar, o la que trae el enlace del correo.
let arrancado = false;
sb.auth.onAuthStateChange((ev, s) => {
  if (arrancado || (ev !== 'INITIAL_SESSION' && ev !== 'SIGNED_IN')) return;
  if (ev === 'INITIAL_SESSION' && !s && location.hash.includes('access_token')) return; // espera SIGNED_IN
  arrancado = !!s;
  setTimeout(inicio); // fuera del callback de auth (evita bloqueo de supabase-js)
});
