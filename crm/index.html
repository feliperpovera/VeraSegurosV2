<html lang="es">
<head>

<style>
/* Tokens de /diseno.css (sistema visual de Vera Seguros). */
:root{--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ink:#1d2433;--ink-2:#4b5263;--ink-3:#646a78;--canvas:#fff;--parchment:#f5f5f7;--hairline:#e2e3e8;--navy:#203152;
  --accent:#218166;--cta:#25D366;--cta-hover:#3ce17c;--cta-ink:#0b2217;--link:#2d4777;--bad:#B23B4E}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;font:15px/1.47 var(--font);color:var(--ink);background:var(--parchment);-webkit-font-smoothing:antialiased}
::selection{background:rgba(33,129,102,.22)}
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.85);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 1px 0 rgba(29,36,51,.07)}
.bar{max-width:1120px;margin:0 auto;min-height:64px;padding:8px 22px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.bar img{height:44px;width:auto;display:block}
nav{display:flex;gap:22px;flex-wrap:wrap}
nav button{background:none;border:0;padding:10px 0;font:14px var(--font);letter-spacing:-.01em;color:var(--ink-2);cursor:pointer}
nav button:hover,nav button[aria-current]{color:var(--ink)}
nav button[aria-current]{font-weight:600}
.yo{margin-left:auto;font-size:13px;color:var(--ink-3)}
.yo button{background:none;border:0;color:var(--link);cursor:pointer;font:inherit;padding:0}
main{max-width:1120px;margin:0 auto;padding:28px 22px 60px}
h1{font-family:var(--font-display);font-size:32px;font-weight:600;letter-spacing:-.022em;margin:0 0 18px}
h2{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:0 0 12px}
.card{background:var(--canvas);border:1px solid var(--hairline);border-radius:22px;box-shadow:0 18px 40px -28px rgba(29,36,51,.35);padding:22px;margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--canvas);border:1px solid var(--hairline);border-radius:18px;padding:16px 18px}
.kpi small{color:var(--ink-3);display:block;font-size:13px}
.kpi strong{font-family:var(--font-display);font-size:26px;font-weight:600;letter-spacing:-.02em;display:block;margin:2px 0}
.up{color:var(--accent)}.down{color:var(--bad)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--hairline);vertical-align:top}
th{font-size:12px;color:var(--ink-3);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
input,select{font:inherit;padding:10px 12px;border:1px solid var(--hairline);border-radius:12px;background:#fff;color:var(--ink);min-width:0}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
button.b{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 20px;border-radius:980px;border:0;background:var(--navy);color:#fff;font:600 15px var(--font);cursor:pointer}
button.b:hover{background:#2d4777}
.wa{display:inline-flex;align-items:center;min-height:36px;padding:6px 16px;border-radius:980px;background:var(--cta);color:var(--cta-ink);font-weight:600;text-decoration:none;font-size:14px}
.wa:hover{background:var(--cta-hover)}
button.s{font:14px var(--font);min-height:36px;padding:6px 14px;border-radius:980px;border:1px solid var(--hairline);background:#fff;color:var(--ink);cursor:pointer}
button.s:hover{border-color:var(--ink-3)}
button:disabled{opacity:.5}
.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vacio{color:var(--ink-3);padding:12px 0;margin:0}
.muted{color:var(--ink-3);font-size:13px}
.tarea{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--hairline)}
.tarea:last-child{border-bottom:0}
.vencida{color:var(--bad);font-size:13px}
.login{max-width:400px;margin:12vh auto;text-align:center}
.login img{height:56px;margin-bottom:8px}
.login input{width:100%;margin:14px 0}
.login button{width:100%}
a{color:var(--link)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.lt{list-style:none;padding:0;margin:0}
.lt li{padding:10px 0;border-bottom:1px solid var(--hairline)}
.scroll{overflow-x:auto}
.cotizador{width:100%;border:0;display:block;min-height:900px}
.vista{width:100%;height:520px;border:1px solid var(--hairline);border-radius:14px;background:#f5f5f7;margin-top:12px}
textarea{font:inherit;padding:10px 12px;border:1px solid var(--hairline);border-radius:12px;width:100%;min-height:90px;resize:vertical}
.oculto{display:none}
@media (max-width:600px){.bar{gap:12px}.bar img{height:36px}nav{gap:14px;width:100%;overflow-x:auto}main{padding:20px 16px 48px}.card{padding:16px;border-radius:18px}}
</style>
</head>
<body>
<div id="app"><p class="login muted">Cargando…</p></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';
const sb = createClient('https://cwfvqusyvfdohjmgefli.supabase.co', 'sb_publishable_r9GjrtKgOR9FEm-bm3lB8A_bnnQOAz5');
const app = document.getElementById('app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cop = (n) => '$' + Math.round(n || 0).toLocaleString('es-CO');
const hoy = () => new Date().toLocaleDateString('en-CA', { timeZone: 'America/Bogota' }); // YYYY-MM-DD
const fecha = (d) => d ? new Date(d).toLocaleDateString('es-CO', { day: 'numeric', month: 'short', timeZone: 'America/Bogota' }) : '';
let yo = null, equipo = [], vista = null, timer = null;
const nombreDe = (id) => equipo.find((e) => e.id === id)?.nombre ?? '—';

async function inicio() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return pantallaLogin();
  const { data } = await sb.rpc('mi_empleado');
  if (!data?.id) {
    app.innerHTML = `<div class="login card"><h2>Sin acceso</h2><p>${esc(session.user.email)} no está registrado como empleado. Pídele al gerente que te agregue.</p><button class="b" id="salir">Salir</button></div>`;
    document.getElementById('salir').onclick = salir;
    return;
  }
  yo = data;
  equipo = (await sb.from('empleado').select('*').order('nombre')).data ?? [];
  // Acceso total (gerente) ve todo; limitado (asesor) solo su trabajo diario.
  const tabs = yo.rol === 'gerente'
    ? [['produccion', 'Producción'], ['financiero', 'Financiero'], ['dia', 'Mi día'], ['equipo', 'Equipo'], ['clientes', 'Clientes'], ['renovaciones', 'Renovaciones'], ['cartera', 'Cartera'], ['cotizar', 'Cotizar autos'], ['revisar', 'Por revisar'], ['ajustes', 'Ajustes']]
    : [['dia', 'Mi día'], ['clientes', 'Clientes'], ['renovaciones', 'Renovaciones'], ['cartera', 'Cartera'], ['cotizar', 'Cotizar autos']];
  app.innerHTML = `<header><div class="bar"><img src="/assets/logo-vera-wordmark.png" alt="Vera Seguros"><nav>${tabs.map(([k, t]) => `<button data-v="${k}">${t}</button>`).join('')}</nav>
    <span class="yo">${esc(yo.nombre)} · <button id="salir">Salir</button></span></div></header><main id="m"></main>`;
  app.querySelectorAll('nav button').forEach((b) => b.onclick = () => ir(b.dataset.v));
  document.getElementById('salir').onclick = salir;
  const v = location.hash.slice(1);
  ir(tabs.some(([k]) => k === v) ? v : (yo.rol === 'gerente' ? 'produccion' : 'dia'));
}

function pantallaLogin() {
  app.innerHTML = `<form class="login card" id="f"><img src="/assets/logo-vera-wordmark.png" alt="Vera Seguros"><h2>CRM</h2><p class="muted">Escribe tu correo de Vera. Te llega un enlace para entrar, sin contraseña.</p>
    <input type="email" id="email" required placeholder="tu@veraseguros.com" autocomplete="email"><button class="b">Enviarme el enlace</button><p id="msg" class="muted"></p></form>`;
  document.getElementById('f').onsubmit = async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button'); btn.disabled = true;
    const { error } = await sb.auth.signInWithOtp({ email: document.getElementById('email').value.trim().toLowerCase(), options: { emailRedirectTo: location.origin + '/crm/' } });
    document.getElementById('msg').textContent = error ? 'No se pudo enviar. Revisa que sea tu correo de Vera.' : 'Listo. Abre tu correo y toca el enlace.';
    btn.disabled = false;
  };
}
async function salir() { await sb.auth.signOut(); location.hash = ''; pantallaLogin(); }

function ir(v) {
  vista = v; location.hash = v; clearInterval(timer);
  app.querySelectorAll('nav button').forEach((b) => b.toggleAttribute('aria-current', b.dataset.v === v));
  const m = document.getElementById('m');
  m.innerHTML = '<p class="muted">Cargando…</p>';
  ({ produccion, financiero, dia, equipo: equipoPanel, clientes, renovaciones, cartera, cotizar, revisar, ajustes })[v]?.(m);
}
const masDias = (n) => { const v = new Date(hoy() + 'T12:00:00'); v.setDate(v.getDate() + n); return v.toLocaleDateString('en-CA'); };
const ETAPAS = ['nuevo', 'contactado', 'cotizado', 'emitido', 'perdido'];
const opcionesEquipo = (sel) => equipo.filter((e) => e.activo && e.rol !== 'comercial').map((e) => `<option value="${e.id}"${e.id === sel ? ' selected' : ''}>${esc(e.nombre)}</option>`).join('');
const enlazar = (m) => m.querySelectorAll('[data-p]').forEach((a) => a.onclick = (e) => { e.preventDefault(); ficha(m, a.dataset.p); });

// Cerrar una tarea con su resultado: mueve la oportunidad, deja historial y, si "sigue", la reprograma a 2 días.
async function cerrarTarea(t, r) {
  await sb.from('tarea').update({ resultado: r, cerrada_at: new Date().toISOString() }).eq('id', t.id);
  if (t.oportunidad_id && (r === 'vendido' || r === 'perdido'))
    await sb.from('oportunidad').update({ etapa: r === 'vendido' ? 'emitido' : 'perdido', actualizado: new Date().toISOString() }).eq('id', t.oportunidad_id);
  if (r === 'sigue') await sb.from('tarea').insert({ persona_id: t.persona_id, oportunidad_id: t.oportunidad_id, asignada_a: t.asignada_a, titulo: t.titulo, vence: masDias(2) });
  if (t.persona_id) await sb.from('evento').insert({ persona_id: t.persona_id, oportunidad_id: t.oportunidad_id, canal: 'tarea', texto: `${t.titulo} → ${r}`, empleado_id: yo.id });
}
const BOTONES = [['vendido', '✅ Vendido'], ['sigue', '⏳ Sigue'], ['perdido', '❌ Perdido'], ['hecho', 'Hecho']];
function filaTarea(t, extra = '') {
  return `<div class="tarea"><div><b>${esc(t.titulo)}</b>${extra}<br>
    ${t.persona ? `<a href="#" data-p="${t.persona.id}">${esc(t.persona.nombre)}</a>${t.persona.telefono ? ` · <a href="https://wa.me/57${esc(t.persona.telefono)}" target="_blank" rel="noopener">WhatsApp ${esc(t.persona.telefono)}</a>` : ''}` : ''}
    <span class="${t.vence < hoy() ? 'vencida' : 'muted'}"> · ${t.vence < hoy() ? 'vencida ' : t.vence === hoy() ? 'hoy' : ''}${t.vence === hoy() ? '' : fecha(t.vence + 'T12:00:00')}</span></div>
    <div class="fila">${BOTONES.map(([r, l]) => `<button class="s" data-t="${t.id}" data-r="${r}">${l}</button>`).join('')}</div></div>`;
}
function botonesTarea(m, lista, recargar) {
  m.querySelectorAll('[data-t]').forEach((b) => b.onclick = async () => {
    b.disabled = true;
    await cerrarTarea(lista.find((x) => x.id === b.dataset.t), b.dataset.r);
    recargar();
  });
  enlazar(m);
}

// Supabase entrega máximo 1000 filas por consulta: se piden por páginas hasta traerlas todas.
async function todas(consulta) {
  const filas = [];
  for (let i = 0; ; i += 1000) {
    const { data } = await consulta().range(i, i + 999);
    filas.push(...(data ?? []));
    if (!data || data.length < 1000) return filas;
  }
}

// ───────── Producción ─────────
function mesKey(d) { return new Date(d).toLocaleDateString('en-CA', { timeZone: 'America/Bogota' }).slice(0, 7); }
function variacion(a, b) { if (!b) return '—'; const p = Math.round((a - b) / b * 100); return `<span class="${p >= 0 ? 'up' : 'down'}">${p >= 0 ? '▲' : '▼'} ${Math.abs(p)}%</span>`; }
const nombreMes = (k) => new Date(k + '-15').toLocaleDateString('es-CO', { month: 'long', year: 'numeric' });
async function produccion(m, mes = hoy().slice(0, 7)) {
  const [y, mm] = mes.split('-').map(Number);
  const mesPasado = new Date(y, mm - 2, 1).toLocaleDateString('en-CA').slice(0, 7);
  const anioPasado = `${y - 1}-${String(mm).padStart(2, '0')}`;
  const desde = new Date(y - 1, mm - 1, 1).toISOString(), hasta = new Date(y, mm, 1).toISOString();
  const esActual = mes === hoy().slice(0, 7);
  const [{ data: pol }, { data: ops }, { data: tar }] = await Promise.all([
    todas(() => sb.from('produccion').select('*').gte('creado', desde).lt('creado', hasta).neq('tipo', 'modificacion')).then((data) => ({ data })),
    sb.from('oportunidad').select('etapa').gte('creado', mes + '-01').lt('creado', hasta),
    sb.from('tarea').select('asignada_a').gte('cerrada_at', hoy() + 'T00:00:00-05:00'),
  ]);
  const suma = (filas, campo) => filas.reduce((s, r) => s + Number(r[campo] || 0), 0);
  const de = (k) => (pol ?? []).filter((r) => mesKey(r.creado) === k);
  const actual = de(mes), pasado = de(mesPasado), anterior = de(anioPasado);
  const deHoy = (pol ?? []).filter((r) => new Date(r.creado).toLocaleDateString('en-CA', { timeZone: 'America/Bogota' }) === hoy());
  const agrupar = (campo, nombre = (x) => x) => Object.entries(actual.reduce((a, r) => {
    const k = nombre(r[campo]) || 'Sin dato'; a[k] ??= { n: 0, prima: 0, com: 0 }; a[k].n++; a[k].prima += +r.prima_neta || 0; a[k].com += +r.comision || 0; return a; }, {}))
    .sort((x, z) => z[1].prima - x[1].prima);
  const tabla = (titulo, filas) => `<div class="card scroll"><h2>${titulo}</h2>${filas.length ? `<table><tr><th></th><th class="n">Pólizas</th><th class="n">Prima neta</th><th class="n">Comisión</th></tr>
    ${filas.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="n">${v.n}</td><td class="n">${cop(v.prima)}</td><td class="n">${cop(v.com)}</td></tr>`).join('')}</table>` : '<p class="vacio">Sin pólizas en este mes.</p>'}</div>`;
  const cerradas = Object.entries((tar ?? []).reduce((a, t) => (a[t.asignada_a] = (a[t.asignada_a] || 0) + 1, a), {}));
  const recientes = [...actual].sort((a, b) => b.creado.localeCompare(a.creado)).slice(0, 15);
  m.innerHTML = `<div class="fila" style="justify-content:space-between"><h1>Producción</h1><label class="muted">Mes <input type="month" id="mes" value="${mes}" max="${hoy().slice(0, 7)}"></label></div>
  <div class="kpis">
    <div class="kpi"><small>Prima neta · ${nombreMes(mes)}</small><strong>${cop(suma(actual, 'prima_neta'))}</strong><small>${variacion(suma(actual, 'prima_neta'), suma(pasado, 'prima_neta'))} vs mes anterior · ${variacion(suma(actual, 'prima_neta'), suma(anterior, 'prima_neta'))} vs año anterior</small></div>
    <div class="kpi"><small>Comisión</small><strong>${cop(suma(actual, 'comision'))}</strong><small>Mes anterior: ${cop(suma(pasado, 'comision'))}</small></div>
    ${esActual ? `<div class="kpi"><small>Hoy</small><strong>${cop(suma(deHoy, 'prima_neta'))}</strong><small>${deHoy.length} pólizas</small></div>` : ''}
    <div class="kpi"><small>Pólizas</small><strong>${actual.length}</strong><small>Mes anterior: ${pasado.length}</small></div>
  </div>
  <div class="grid2">${tabla('Por aseguradora', agrupar('aseguradora'))}${tabla('Por ramo', agrupar('ramo'))}</div>
  <div class="grid2">${tabla('Por asesor', agrupar('asesor_id', nombreDe))}
    <div class="card"><h2>Embudo del mes</h2><table>${ETAPAS.map((e) => `<tr><td>${e}</td><td class="n">${(ops ?? []).filter((o) => o.etapa === e).length}</td></tr>`).join('')}</table>
    <h2 style="margin-top:16px">Tareas cerradas hoy</h2>${cerradas.length ? `<table>${cerradas.map(([id, n]) => `<tr><td>${esc(nombreDe(id))}</td><td class="n">${n}</td></tr>`).join('')}</table>` : '<p class="vacio">Ninguna todavía.</p>'}</div></div>
  <div class="card scroll"><h2>Últimas pólizas del mes</h2>${recientes.length ? `<table><tr><th>Fecha</th><th>Aseguradora</th><th>Ramo</th><th>N.º</th><th>Asesor</th><th class="n">Prima neta</th></tr>
    ${recientes.map((x) => `<tr><td>${fecha(x.creado)}</td><td>${esc(x.aseguradora)}</td><td>${esc(x.ramo)}</td><td>${x.persona_id ? `<a href="#" data-p="${x.persona_id}">${esc(x.numero)}</a>` : esc(x.numero)}</td><td>${esc(nombreDe(x.asesor_id))}</td><td class="n">${cop(x.prima_neta)}</td></tr>`).join('')}</table>` : '<p class="vacio">Sin pólizas en este mes.</p>'}</div>
  ${esActual ? '<p class="muted">Se actualiza solo cada minuto.</p>' : ''}`;
  document.getElementById('mes').onchange = (e) => { clearInterval(timer); produccion(m, e.target.value || hoy().slice(0, 7)); };
  enlazar(m);
  if (esActual) timer = setInterval(() => vista === 'produccion' && produccion(m), 60000);
}

// ───────── Financiero (acceso total): ventas comparadas con años anteriores ─────────
const MESES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
const SERIE = ['#eb6834', '#1baf7a', '#2a78d6']; // hace 2 años, año anterior, este año (paleta validada; el año actual en azul)
const millones = (n) => '$' + (n / 1e6).toLocaleString('es-CO', { maximumFractionDigits: n >= 1e8 ? 0 : 1 }) + ' M';
const pct = (a, b) => (b ? variacion(a, b) : '<span class="muted">—</span>');
async function financiero(m, anio = Number(hoy().slice(0, 4))) {
  const anios = [anio - 2, anio - 1, anio];
  const filas = await todas(() => sb.from('produccion').select('prima_neta,comision,creado,ramo,aseguradora,asesor_id')
    .gte('creado', `${anios[0]}-01-01`).lt('creado', `${anio + 1}-01-01`).neq('tipo', 'modificacion'));
  const mesHoy = Number(hoy().slice(5, 7)), diaHoy = hoy().slice(5);
  const esActual = anio === Number(hoy().slice(0, 4));
  const corte = esActual ? mesHoy : 12;
  const tabla = {}; // tabla[año][mes] = { prima, com, n }
  for (const a of anios) tabla[a] = MESES.map(() => ({ prima: 0, com: 0, n: 0 }));
  const ytd = (a) => ({ prima: 0, com: 0, n: 0 });
  const acum = Object.fromEntries(anios.map((a) => [a, ytd()]));
  const porRamo = {}, porAsesor = {};
  for (const r of filas) {
    const f = new Date(r.creado).toLocaleDateString('en-CA', { timeZone: 'America/Bogota' });
    const a = Number(f.slice(0, 4)), mm = Number(f.slice(5, 7)) - 1;
    if (!tabla[a]) continue;
    const c = tabla[a][mm]; c.prima += +r.prima_neta || 0; c.com += +r.comision || 0; c.n++;
    const enCorte = !esActual || f.slice(5) <= diaHoy; // mismo periodo del año: hasta hoy
    if (enCorte) { acum[a].prima += +r.prima_neta || 0; acum[a].com += +r.comision || 0; acum[a].n++; }
    if (enCorte && a >= anio - 1) {
      (porRamo[r.ramo || 'Sin ramo'] ??= { [anio - 1]: 0, [anio]: 0 })[a] += +r.prima_neta || 0;
      if (a === anio) { const k = r.asesor_id || ''; porAsesor[k] ??= { prima: 0, com: 0, n: 0 }; porAsesor[k].prima += +r.prima_neta || 0; porAsesor[k].com += +r.comision || 0; porAsesor[k].n++; }
    }
  }
  const [a0, a1, a2] = anios.map((a) => acum[a]);
  const ingresos = await seccionIngresos(anio, esActual ? corte : 12);
  const mesAct = tabla[anio][corte - 1], mesAnt = tabla[anio - 1][corte - 1];
  const periodo = esActual ? `1 ene – ${fecha(hoy() + 'T12:00:00')}` : 'año completo';

// Ingresos facturados (FEL − NC) por mes, desde finanzas_mes. Comparación con el mismo periodo de años anteriores.
async function seccionIngresos(anio, corte) {
  const { data } = await sb.from('finanzas_mes').select('*').order('anio').order('mes');
  const f = data ?? [];
  const neto = (a, hasta = 12) => f.filter((r) => r.anio === a && r.mes <= hasta).reduce((s, r) => s + Number(r.neto), 0);
  const val = (a, mm) => f.find((r) => r.anio === a && r.mes === mm);
  const ultimoMes = Math.max(0, ...f.filter((r) => r.anio === anio).map((r) => r.mes));
  const hasta = Math.min(corte, ultimoMes || corte);
  const anios = [anio - 2, anio - 1, anio];
  const todosAnios = [...new Set(f.map((r) => r.anio))].sort();
  const fel = f.filter((r) => r.anio === anio && r.mes <= hasta).reduce((s, r) => s + Number(r.facturado), 0);
  const nc = f.filter((r) => r.anio === anio && r.mes <= hasta).reduce((s, r) => s + Number(r.notas_credito), 0);
  const promedio = hasta ? neto(anio, hasta) / hasta : 0;
  const html = `<h2 style="margin:8px 0 12px;font-size:22px">Ingresos facturados (facturas − notas crédito)</h2>
    ${ultimoMes ? `<div class="kpis">
      <div class="kpi"><small>Neto ${anio} · ene–${MESES[hasta - 1].toLowerCase()}</small><strong>${cop(neto(anio, hasta))}</strong><small>${pct(neto(anio, hasta), neto(anio - 1, hasta))} vs ${anio - 1} mismo periodo · ${pct(neto(anio, hasta), neto(anio - 2, hasta))} vs ${anio - 2}</small></div>
      <div class="kpi"><small>${MESES[hasta - 1]} ${anio}</small><strong>${cop(val(anio, hasta)?.neto)}</strong><small>${pct(Number(val(anio, hasta)?.neto ?? 0), Number(val(anio - 1, hasta)?.neto ?? 0))} vs ${MESES[hasta - 1]} ${anio - 1}</small></div>
      <div class="kpi"><small>Promedio mensual ${anio}</small><strong>${cop(promedio)}</strong><small>${anio - 1}: ${cop(neto(anio - 1) / 12)} al mes</small></div>
      <div class="kpi"><small>Notas crédito ${anio}</small><strong>${cop(nc)}</strong><small>${fel ? (nc / fel * 100).toFixed(1) : 0}% de lo facturado</small></div>
    </div>` : `<div class="card"><p class="vacio">No hay ingresos cargados para ${anio}.</p></div>`}
    <div class="card"><h2>Neto facturado por mes</h2>
      <div class="fila" style="gap:16px;margin-bottom:6px">${anios.map((a, i) => `<span class="muted"><span style="display:inline-block;width:14px;height:3px;border-radius:2px;background:${SERIE[i]};vertical-align:middle;margin-right:6px"></span>${a}</span>`).join('')}</div>
      <div id="grafIng" style="position:relative"></div></div>
    <div class="card scroll"><h2>Año contra año</h2><table><tr><th>Año</th><th class="n">Facturado</th><th class="n">Notas crédito</th><th class="n">Neto</th><th class="n">Crecimiento</th><th class="n">Ene–${MESES[hasta - 1] ?? 'Dic'}</th><th class="n">Crec. mismo periodo</th></tr>
      ${todosAnios.map((a) => { const fa = f.filter((r) => r.anio === a); const meses = fa.length;
        return `<tr><td>${a}${meses < 12 ? ` <span class="muted">(${meses} meses)</span>` : ''}</td><td class="n">${cop(fa.reduce((s, r) => s + Number(r.facturado), 0))}</td><td class="n">${cop(fa.reduce((s, r) => s + Number(r.notas_credito), 0))}</td>
          <td class="n"><b>${cop(neto(a))}</b></td><td class="n">${meses === 12 && todosAnios.includes(a - 1) ? pct(neto(a), neto(a - 1)) : '<span class="muted">—</span>'}</td>
          <td class="n">${cop(neto(a, hasta))}</td><td class="n">${todosAnios.includes(a - 1) ? pct(neto(a, hasta), neto(a - 1, hasta)) : '<span class="muted">—</span>'}</td></tr>`; }).join('')}</table>
      ${todosAnios.length && todosAnios.some((a, i) => i && a - todosAnios[i - 1] > 1) ? '<p class="muted">Falta cargar algún año intermedio; su crecimiento se compara contra el último año con datos.</p>' : ''}</div>
    <div class="card"><h2>Cargar o corregir un mes</h2><form class="fila" id="fFin">
      <select name="anio">${[0, 1, 2, 3, 4, 5].map((k) => Number(hoy().slice(0, 4)) - k).map((a) => `<option>${a}</option>`).join('')}</select>
      <select name="mes">${MESES.map((mn, i) => `<option value="${i + 1}"${i + 1 === Number(hoy().slice(5, 7)) ? ' selected' : ''}>${mn}</option>`).join('')}</select>
      <input name="facturado" required inputmode="decimal" placeholder="FEL (facturado)"><input name="notas_credito" inputmode="decimal" placeholder="NC (notas crédito)">
      <button class="b">Guardar</button><span id="msgFin" class="muted"></span></form>
      <p class="muted">Copia los totales del reporte "Total de base imponible por prefijo" (fila FEL y fila NC).</p></div>`;
  const despues = (m, a) => {
    grafica(document.getElementById('grafIng'), anios.map((y) => MESES.map((_, i) => { const r = val(y, i + 1); return r ? Number(r.neto) : null; })), anios);
    document.getElementById('fFin').onsubmit = async (e) => {
      e.preventDefault();
      const d = Object.fromEntries(new FormData(e.target)), num = (v) => { v = String(v).replace(/[^\d.,]/g, ''); // 93.931.571,00 o 93931571.00
        return Number(v.includes(',') ? v.replace(/\./g, '').replace(',', '.') : /\.\d{1,2}$/.test(v) ? v : v.replace(/\./g, '')) || 0; };
      const { error } = await sb.from('finanzas_mes').upsert({ anio: Number(d.anio), mes: Number(d.mes), facturado: num(d.facturado), notas_credito: num(d.notas_credito), actualizado: new Date().toISOString() });
      if (error) return document.getElementById('msgFin').textContent = 'No se pudo guardar.';
      financiero(m, a);
    };
  };
  return { html, despues };
}
// Líneas por año (un solo eje, 2px), cuadrícula tenue, cruz y tooltip al pasar el mouse.
function grafica(caja, series, anios) {
  const W = 720, H = 260, L = 64, R = 16, T = 12, B = 28;
  const max = Math.max(1, ...series.flat().filter((v) => v != null));
  const paso = 10 ** Math.floor(Math.log10(max / 4)), tope = Math.ceil(max / 4 / paso) * paso * 4;
  const x = (i) => L + (i * (W - L - R)) / 11, y = (v) => T + (H - T - B) * (1 - v / tope);
  const linea = (s) => s.map((v, i) => (v == null ? null : `${x(i)},${y(v)}`)).filter(Boolean).join(' ');
  caja.innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Prima neta por mes, ${anios.join(', ')}">
    ${[0, 1, 2, 3, 4].map((k) => `<line x1="${L}" x2="${W - R}" y1="${y((tope * k) / 4)}" y2="${y((tope * k) / 4)}" stroke="#e2e3e8" stroke-width="1"/>
      <text x="${L - 8}" y="${y((tope * k) / 4) + 4}" text-anchor="end" font-size="11" fill="#646a78">${millones((tope * k) / 4)}</text>`).join('')}
    ${MESES.map((mn, i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#646a78">${mn}</text>`).join('')}
    <line id="cruz" y1="${T}" y2="${H - B}" stroke="#646a78" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>
    ${series.map((s, k) => `<polyline points="${linea(s)}" fill="none" stroke="${SERIE[k]}" stroke-width="${k === 2 ? 2.5 : 2}" stroke-linejoin="round" stroke-linecap="round"/>`).join('')}
    <g id="puntos"></g>
    ${MESES.map((_, i) => `<rect data-i="${i}" x="${x(i) - (W - L - R) / 22}" y="${T}" width="${(W - L - R) / 11}" height="${H - T - B}" fill="transparent"/>`).join('')}
  </svg><div id="tip" class="card" style="position:absolute;pointer-events:none;padding:10px 12px;margin:0;font-size:13px;display:none;min-width:150px"></div>`;
  const svg = caja.querySelector('svg'), tip = caja.querySelector('#tip'), cruz = caja.querySelector('#cruz'), pts = caja.querySelector('#puntos');
  const ocultar = () => { tip.style.display = 'none'; cruz.setAttribute('visibility', 'hidden'); pts.innerHTML = ''; };
  svg.querySelectorAll('rect[data-i]').forEach((r) => {
    r.onmouseenter = () => {
      const i = Number(r.dataset.i);
      cruz.setAttribute('x1', x(i)); cruz.setAttribute('x2', x(i)); cruz.setAttribute('visibility', 'visible');
      pts.innerHTML = series.map((s, k) => (s[i] == null ? '' : `<circle cx="${x(i)}" cy="${y(s[i])}" r="4.5" fill="${SERIE[k]}" stroke="#fff" stroke-width="2"/>`)).join('');
      tip.innerHTML = `<b>${MESES[i]}</b>` + series.map((s, k) => `<div style="display:flex;justify-content:space-between;gap:12px"><span><span style="display:inline-block;width:10px;height:3px;background:${SERIE[k]};vertical-align:middle;margin-right:6px"></span>${anios[k]}</span><b>${s[i] == null ? '—' : cop(s[i])}</b></div>`).join('');
      tip.style.display = 'block';
      const ancho = caja.clientWidth, px = (x(i) / W) * ancho;
      tip.style.left = Math.min(Math.max(px + 12, 0), ancho - tip.offsetWidth) + 'px'; tip.style.top = '8px';
    };
  });
  svg.onmouseleave = ocultar;
}

// ───────── Subir pólizas en PDF (Claude las lee con la función caratulas) ─────────
function subirPolizas(caja, alTerminar) {
  caja.innerHTML = `<div class="card"><h2>Subir pólizas en PDF</h2><p class="muted">Para las pólizas que no llegaron por correo. Claude lee cada carátula y la crea con su cliente; si tiene dudas, queda en Por revisar.</p>
    <input type="file" id="pdfs" accept="application/pdf" multiple><ul class="lt" id="subidas"></ul></div>`;
  document.getElementById('pdfs').onchange = async (e) => {
    const lista = document.getElementById('subidas');
    for (const f of e.target.files) {
      const li = document.createElement('li'); li.textContent = `${f.name}: leyendo…`; lista.append(li);
      if (f.size > 15 * 1024 * 1024) { li.textContent = `${f.name}: muy pesado (máx. 15 MB)`; continue; }
      const b64 = await new Promise((ok) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.readAsDataURL(f); });
      const { data } = await sb.functions.invoke('caratulas', { body: { contenido: b64, nombre: f.name } });
      li.textContent = `${f.name}: ` + (data?.omitido === 'repetido' ? 'ya estaba en el CRM' : data?.poliza === false ? 'no parece una póliza'
        : data?.ok ? `${data.datos.aseguradora} ${data.datos.ramo} N.º ${data.datos.numero} · ${data.datos.tomador ?? ''}${data.revisar ? ' · ⚠️ queda en Por revisar' : ' ✅'}` : 'no se pudo leer, intenta de nuevo');
    }
    alTerminar?.();
  };
}

// ───────── Cartera ─────────
async function cartera(m, filtro = 'pendientes') {
  let c = sb.from('produccion').select('*').neq('tipo', 'modificacion').order('pago_limite', { nullsFirst: false }).limit(500);
  c = filtro === 'pendientes' ? c.in('cartera', ['pendiente', 'vencida']) : filtro === 'sin_dato' ? c.eq('cartera', 'sin_dato').gte('vigencia_hasta', hoy()) : c;
  const { data } = await c;
  const xs = (data ?? []).map((x) => ({ ...x, vencida: x.cartera === 'pendiente' && x.pago_limite && x.pago_limite < hoy() }));
  const nombres = {};
  const ids = [...new Set(xs.map((x) => x.persona_id).filter(Boolean))];
  if (ids.length) (await sb.from('persona').select('id,nombre,telefono').in('id', ids)).data?.forEach((p) => nombres[p.id] = p);
  const saldo = (f) => xs.filter(f).reduce((a, x) => a + (+(x.saldo ?? x.prima_total ?? 0) || 0), 0);
  m.innerHTML = `<div class="fila" style="justify-content:space-between"><h1>Cartera</h1>
      <select id="filtro"><option value="pendientes">Por cobrar (pendiente y vencida)</option><option value="sin_dato"${filtro === 'sin_dato' ? ' selected' : ''}>Vigentes sin dato de pago</option><option value="todas"${filtro === 'todas' ? ' selected' : ''}>Todas</option></select></div>
    ${filtro === 'pendientes' ? `<div class="kpis"><div class="kpi"><small>Por cobrar</small><strong>${cop(saldo((x) => true))}</strong><small>${xs.length} pólizas</small></div>
      <div class="kpi"><small>Vencida</small><strong class="down">${cop(saldo((x) => x.cartera === 'vencida' || x.vencida))}</strong><small>${xs.filter((x) => x.cartera === 'vencida' || x.vencida).length} pólizas</small></div></div>` : ''}
    <div class="card scroll">${xs.length ? `<table><tr><th>Cliente</th><th>Aseguradora</th><th>Ramo</th><th>N.º</th><th>Estado</th><th>Pagar antes de</th><th class="n">Saldo</th><th></th></tr>
      ${xs.map((x) => { const p = nombres[x.persona_id]; return `<tr><td>${p ? `<a href="#" data-p="${p.id}">${esc(p.nombre)}</a>${p.telefono ? `<br><a href="https://wa.me/57${esc(p.telefono)}" target="_blank" rel="noopener" class="muted">WhatsApp</a>` : ''}` : '<span class="muted">Sin cliente</span>'}</td>
        <td>${esc(x.aseguradora)}</td><td>${esc(x.ramo)}</td><td>${esc(x.numero)}</td>
        <td>${selEstado(ESTADO_CAR, x.cartera, `data-car="${x.id}"`)}${x.vencida ? '<br><span class="vencida">pasó la fecha</span>' : ''}</td>
        <td><input type="date" data-lim="${x.id}" value="${esc(x.pago_limite)}" style="padding:4px 8px"></td>
        <td class="n"><input data-sal="${x.id}" value="${esc(x.saldo ?? '')}" placeholder="${esc(x.prima_total ?? '')}" inputmode="numeric" style="width:120px;padding:4px 8px;text-align:right"></td>
        <td><button class="s" data-g="${x.id}">Guardar</button></td></tr>`; }).join('')}</table>`
      : '<p class="vacio">Nada por aquí.</p>'}</div>
    <p class="muted">La cartera se llena con la importación de la base de la compañía y se actualiza aquí. Siguiente paso: que Claude lea también los estados de cartera que mandan las aseguradoras.</p>`;
  document.getElementById('filtro').onchange = (e) => cartera(m, e.target.value);
  m.querySelectorAll('[data-g]').forEach((b) => b.onclick = async () => {
    const id = b.dataset.g, x = xs.find((y) => y.id === id);
    const sal = m.querySelector(`[data-sal="${id}"]`).value.replace(/\D/g, '');
    b.disabled = true;
    await gestionar(x, { cartera: m.querySelector(`[data-car="${id}"]`).value, pago_limite: m.querySelector(`[data-lim="${id}"]`).value || null, saldo: sal ? Number(sal) : null });
    b.textContent = 'Guardado ✓';
  });
  enlazar(m);
}

// ───────── Clientes ─────────
const POR_PAGINA = 50;
async function clientes(m, f = { q: '', asesor: '', orden: 'reciente', pagina: 0 }) {
  let c = sb.from('persona').select('id,nombre,cedula,telefono,email,ciudad,asesor_id,origen,creado,oportunidad(producto,etapa)', { count: 'exact' });
  const limpio = f.q.replace(/[,()%*]/g, ' ').trim();
  if (limpio) c = c.or(`nombre.ilike.%${limpio}%,cedula.ilike.%${limpio}%,telefono.ilike.%${limpio}%,email.ilike.%${limpio}%`);
  if (f.asesor === 'yo') c = c.eq('asesor_id', yo.id); else if (f.asesor === 'sin') c = c.is('asesor_id', null); else if (f.asesor) c = c.eq('asesor_id', f.asesor);
  c = f.orden === 'nombre' ? c.order('nombre') : c.order('creado', { ascending: false });
  const { data, count } = await c.range(f.pagina * POR_PAGINA, f.pagina * POR_PAGINA + POR_PAGINA - 1);
  const total = count ?? 0, paginas = Math.max(1, Math.ceil(total / POR_PAGINA));
  const etapa = (p) => (p.oportunidad ?? []).map((o) => `${esc(o.producto)} · ${o.etapa}`).join('<br>') || '<span class="muted">—</span>';
  m.innerHTML = `<div class="fila" style="justify-content:space-between"><h1>Clientes</h1><button class="b" id="nuevo">+ Nuevo cliente</button></div>
    <div class="card"><form class="fila" id="buscar"><input id="q" placeholder="Nombre, cédula, celular o correo" value="${esc(f.q)}" style="flex:1;min-width:220px">
      <select id="asesor"><option value="">Todos los asesores</option><option value="yo"${f.asesor === 'yo' ? ' selected' : ''}>Mis clientes</option><option value="sin"${f.asesor === 'sin' ? ' selected' : ''}>Sin asesor</option>${opcionesEquipo(f.asesor)}</select>
      <select id="orden"><option value="reciente">Más recientes</option><option value="nombre"${f.orden === 'nombre' ? ' selected' : ''}>Por nombre</option></select>
      <button class="b">Buscar</button></form><p class="muted" style="margin:10px 0 0">${total.toLocaleString('es-CO')} clientes</p></div>
    <div class="card scroll">${data?.length ? `<table><tr><th>Nombre</th><th>Celular</th><th>Correo</th><th>Ciudad</th><th>Asesor</th><th>Oportunidad</th></tr>
      ${data.map((p) => `<tr><td><a href="#" data-p="${p.id}">${esc(p.nombre)}</a>${p.cedula ? `<br><span class="muted">CC ${esc(p.cedula)}</span>` : ''}</td><td>${esc(p.telefono)}</td><td>${esc(p.email)}</td><td>${esc(p.ciudad)}</td><td>${esc(nombreDe(p.asesor_id))}</td><td>${etapa(p)}</td></tr>`).join('')}</table>
      <div class="fila" style="justify-content:space-between;margin-top:12px"><button class="s" id="ant"${f.pagina ? '' : ' disabled'}>← Anterior</button><span class="muted">Página ${f.pagina + 1} de ${paginas}</span><button class="s" id="sig"${f.pagina + 1 < paginas ? '' : ' disabled'}>Siguiente →</button></div>`
      : '<p class="vacio">Sin resultados.</p>'}</div>`;
  const leer = (pagina = 0) => ({ q: document.getElementById('q').value, asesor: document.getElementById('asesor').value, orden: document.getElementById('orden').value, pagina });
  document.getElementById('buscar').onsubmit = (e) => { e.preventDefault(); clientes(m, leer()); };
  document.getElementById('asesor').onchange = document.getElementById('orden').onchange = () => clientes(m, leer());
  document.getElementById('ant')?.addEventListener('click', () => clientes(m, leer(f.pagina - 1)));
  document.getElementById('sig')?.addEventListener('click', () => clientes(m, leer(f.pagina + 1)));
  document.getElementById('nuevo').onclick = () => formCliente(m);
  enlazar(m);
}
// Crear o editar un cliente (los mismos campos en los dos casos).
function formCliente(m, p = null) {
  const v = (k) => esc(p?.[k] ?? '');
  m.innerHTML = `<p><a href="#" id="volver">← ${p ? esc(p.nombre) : 'Clientes'}</a></p><form class="card" id="f"><h2>${p ? 'Editar cliente' : 'Nuevo cliente'}</h2>

    ficha(m, r.data.id);

      ${p.notas ? `<p>${esc(p.notas)}</p>` : ''}
      <div class="fila">${p.telefono ? `<a class="wa" href="https://wa.me/57${esc(p.telefono)}" target="_blank" rel="noopener">WhatsApp</a>` : ''}
        <button class="s" data-canal="correo">✉️ Enviar correo</button><button class="s" data-canal="whatsapp">💬 Plantilla WhatsApp</button></div>

    <div class="grid2"><div>
      <div class="card"><h2>Tareas abiertas</h2>${(tar ?? []).map((t) => `<p style="margin:6px 0">${esc(t.titulo)} <span class="${t.vence < hoy() ? 'vencida' : 'muted'}">· ${fecha(t.vence + 'T12:00:00')} · ${esc(nombreDe(t.asignada_a))}</span></p>`).join('') || '<p class="vacio">Ninguna.</p>'}
        <form class="fila" id="ftarea" style="margin-top:10px"><input name="titulo" required placeholder="Ej. Llamar para renovar" style="flex:1;min-width:160px">

      <div class="card scroll"><h2>Pólizas</h2>${pol?.length ? `<table><tr><th>Aseguradora</th><th>Ramo</th><th>N.º</th><th>Vence</th><th class="n">Prima</th></tr>

    if (!e.target.value) return;

// ───────── Enviar correo / WhatsApp con plantilla ─────────
// La función enviar arma el mensaje en el servidor y solo escribe al correo o celular guardado del cliente.
async function panelEnvio(m, p, canal) {
  const caja = document.getElementById('envio');
  const { data: pl } = await sb.from('plantilla').select('id,nombre').eq('canal', canal).eq('activa', true).order('nombre');
  const destino = canal === 'correo' ? p.email : p.telefono;
  caja.className = 'card';
  caja.style.marginTop = '16px';
  if (!destino) { caja.innerHTML = `<p class="vacio">Este cliente no tiene ${canal === 'correo' ? 'correo' : 'celular'} guardado.</p>`; return; }
  if (!pl?.length) { caja.innerHTML = `<p class="vacio">No hay plantillas de ${canal === 'correo' ? 'correo' : 'WhatsApp'}. ${yo.rol === 'gerente' ? 'Créalas en Ajustes.' : 'Pídele al gerente que las cree.'}</p>`; return; }
  caja.innerHTML = `<h2>${canal === 'correo' ? '✉️ Correo' : '💬 WhatsApp'} a ${esc(destino)}</h2>
    <div class="fila"><select id="pl" style="flex:1">${pl.map((x) => `<option value="${x.id}">${esc(x.nombre)}</option>`).join('')}</select></div>
    <p class="muted" style="margin:10px 0 4px">Mensaje adicional (opcional, va donde la plantilla dice {{mensaje}})</p><textarea id="msj" maxlength="2000"></textarea>
    <div class="fila" style="margin-top:10px"><button class="s" id="ver">Vista previa</button><button class="b" id="mandar">Enviar</button><span id="est" class="muted"></span></div>
    <div id="prev"></div>`;
  const cuerpo = () => ({ persona_id: p.id, plantilla_id: document.getElementById('pl').value, mensaje: document.getElementById('msj').value });
  const est = document.getElementById('est');
  document.getElementById('ver').onclick = async () => {
    const { data, error } = await sb.functions.invoke('enviar', { body: { accion: 'vista', ...cuerpo() } });
    if (error || !data?.ok) return est.textContent = 'No se pudo generar la vista previa.';
    const prev = document.getElementById('prev');
    if (data.canal === 'correo') {
      prev.innerHTML = `<p style="margin:14px 0 0"><b>Asunto:</b> ${esc(data.asunto)}</p><iframe class="vista" sandbox title="Vista previa del correo"></iframe>`;
      prev.querySelector('iframe').srcdoc = data.html;
    } else prev.innerHTML = `<p class="muted" style="margin-top:12px">Variables que se envían en la plantilla:</p><ul class="lt">${data.textos.map((t) => `<li>${esc(t)}</li>`).join('') || '<li>Sin variables</li>'}</ul>`;
  };
  document.getElementById('mandar').onclick = async (e) => {
    if (!confirm(`¿Enviar "${document.getElementById('pl').selectedOptions[0].text}" a ${destino}?`)) return;
    e.target.disabled = true; est.textContent = 'Enviando…';
    const { data, error } = await sb.functions.invoke('enviar', { body: { accion: 'enviar', ...cuerpo() } });
    if (error || !data?.ok) { e.target.disabled = false; return est.textContent = 'No se envió: ' + (data?.error || 'error de conexión'); }
    ficha(m, p.id);
  };
}

// ───────── Por revisar ─────────
async function revisar(m) {
  const [{ data }, { data: ult }] = await Promise.all([
    sb.from('poliza').select('*').eq('revision', 'pendiente').order('creado'),
    sb.from('caratula').select('creado,de,asunto,nombre,estado,error').order('creado', { ascending: false }).limit(15)]);
  const ESTADO = { poliza: '✅ Póliza', no_es_poliza: 'No es póliza', error: '⚠️ Error', recibida: 'Leyendo…' };
  m.innerHTML = `<div class="fila" style="justify-content:space-between"><h1>Por revisar</h1><button class="b" id="subir">Subir pólizas PDF</button></div><div id="cajaSubir"></div><div class="card"><h2>Carátulas con dudas</h2><p class="muted">La IA no estuvo segura de estos datos. Compáralos con el PDF y corrige si hace falta.</p>
    ${data?.length ? data.map((x) => `<form class="tarea" data-id="${x.id}"><div class="fila">
      <input name="aseguradora" value="${esc(x.aseguradora)}" placeholder="Aseguradora" size="12"><input name="ramo" value="${esc(x.ramo)}" placeholder="Ramo" size="10">
      <input name="numero" value="${esc(x.numero)}" placeholder="N.º póliza" size="12"><input name="prima_neta" value="${esc(x.prima_neta)}" placeholder="Prima neta" inputmode="numeric" size="12">
      <input name="vigencia_desde" type="date" value="${esc(x.vigencia_desde)}"><input name="vigencia_hasta" type="date" value="${esc(x.vigencia_hasta)}"></div>
      <div class="fila">${x.pdf_path ? `<a href="#" data-pdf="${esc(x.pdf_path)}">Ver PDF</a>` : ''}<button class="b">Correcto</button></div></form>`).join('')
      : '<p class="vacio">Nada por revisar.</p>'}</div>
    <div class="card scroll"><h2>Últimas carátulas recibidas en info@</h2>${ult?.length ? `<table><tr><th>Llegó</th><th>De</th><th>Archivo</th><th>Resultado</th></tr>
      ${ult.map((c) => `<tr><td>${fecha(c.creado)}</td><td>${esc(c.de)}</td><td>${esc(c.nombre)}<br><span class="muted">${esc(c.asunto)}</span></td><td>${ESTADO[c.estado] ?? esc(c.estado)}${c.error ? `<br><span class="muted">${esc(c.error)}</span>` : ''}</td></tr>`).join('')}</table>`
      : '<p class="vacio">Todavía no ha llegado ninguna. Se conectan con la Logic App de Azure.</p>'}</div>`;
  document.getElementById('subir').onclick = () => subirPolizas(document.getElementById('cajaSubir'), () => revisar(m));
  m.querySelectorAll('form[data-id]').forEach((f) => f.onsubmit = async (e) => {
    e.preventDefault();
    const d = Object.fromEntries([...new FormData(f)].map(([k, v]) => [k, v.trim() || null]));
    d.prima_neta = d.prima_neta ? Number(d.prima_neta.replace(/\D/g, '')) : null;
    const { error } = await sb.from('poliza').update({ ...d, revision: 'ok' }).eq('id', f.dataset.id);
    if (error) return alert(error.message);
    revisar(m);
  });
  m.querySelectorAll('[data-pdf]').forEach((a) => a.onclick = async (e) => {
    e.preventDefault();
    const { data: u } = await sb.storage.from('caratulas').createSignedUrl(a.dataset.pdf, 300);
    if (u?.signedUrl) window.open(u.signedUrl, '_blank', 'noopener');
  });
}

// ───────── Importación CSV (acceso total) ─────────
// La base de datos une y valida (importar_personas / importar_polizas); aquí solo se lee el archivo y se manda por lotes.
function leerCsv(texto) {
  const filas = []; let f = [], c = '', q = false;
  for (let i = 0; i < texto.length; i++) {
    const ch = texto[i];
    if (q) { if (ch === '"' && texto[i + 1] === '"') { c += '"'; i++; } else if (ch === '"') q = false; else c += ch; }
    else if (ch === '"') q = true; else if (ch === ',') { f.push(c); c = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && texto[i + 1] === '\n') i++; f.push(c); if (f.some((x) => x.trim())) filas.push(f); f = []; c = ''; }
    else c += ch;
  }
  f.push(c); if (f.some((x) => x.trim())) filas.push(f);
  const cab = filas.shift().map((h) => h.replace(/^\uFEFF/, '').trim().toLowerCase());
  return filas.map((x) => Object.fromEntries(cab.map((h, i) => [h, (x[i] ?? '').trim()])));
}
async function importarCsv(archivo, prevalece, est) {
  if (!archivo) return;
  const filas = leerCsv(await archivo.text());
  const esPoliza = filas.length && 'numero' in filas[0] && 'aseguradora' in filas[0];
  if (!filas.length) return est.textContent = 'El archivo está vacío.';
  if (!confirm(`¿Importar ${filas.length.toLocaleString('es-CO')} ${esPoliza ? 'pólizas' : 'clientes'} de "${archivo.name}"?${!esPoliza && prevalece ? ' Los datos de este archivo reemplazarán los guardados.' : ''}`)) return;
  const tot = { nuevos: 0, actualizados: 0, errores: 0 }, lote = esPoliza ? 300 : 500;
  for (let i = 0; i < filas.length; i += lote) {
    const parte = filas.slice(i, i + lote);
    if (esPoliza) parte.forEach((r) => { try { r.datos = r.datos ? JSON.parse(r.datos) : null; } catch { r.datos = null; } });
    const { data, error } = esPoliza ? await sb.rpc('importar_polizas', { filas: parte }) : await sb.rpc('importar_personas', { filas: parte, prevalece });
    if (error) { est.textContent = `Se detuvo en la fila ${i + 1}: ${error.message}`; return; }
    if (!esPoliza && ['tipo_doc', 'genero', 'email2', 'telefono2', 'empresa'].some((k) => k in parte[0])) await sb.rpc('completar_persona', { filas: parte });
    tot.nuevos += data.nuevos ?? data.nuevas; tot.actualizados += data.actualizados ?? data.actualizadas; tot.errores += data.errores;
    est.textContent = `Importando… ${Math.min(i + lote, filas.length).toLocaleString('es-CO')} de ${filas.length.toLocaleString('es-CO')}`;
  }
  est.textContent = `Listo: ${tot.nuevos} nuevos, ${tot.actualizados} actualizados, ${tot.errores} filas sin datos suficientes.`;
}

// ───────── Ajustes (gerente) ─────────
async function ajustes(m) {
  const [{ data: tar }, { data: pls }] = await Promise.all([sb.from('comision_tarifa').select('*').order('aseguradora'), sb.from('plantilla').select('*').order('canal').order('nombre')]);
  equipo = (await sb.from('empleado').select('*').order('nombre')).data ?? [];
  m.innerHTML = `<div class="grid2"><div class="card scroll"><h2>Empleados</h2><table><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th></th></tr>
      ${equipo.map((e) => `<tr><td>${esc(e.nombre)}</td><td>${esc(e.email)}</td><td>${e.rol === 'gerente' ? 'Acceso total' : e.rol === 'comercial' ? 'Socio sin usuario' : 'Limitado'}${e.codigo ? ` <span class="muted">${esc(e.codigo)}</span>` : ''}</td><td><button class="s" data-e="${e.id}" data-a="${e.activo}">${e.activo ? 'Desactivar' : 'Activar'}</button></td></tr>`).join('')}</table>
      <form class="fila" id="fe" style="margin-top:12px"><input name="nombre" required placeholder="Nombre"><input name="email" type="email" required placeholder="correo@veraseguros.com">
      <select name="rol"><option value="asesor">Limitado</option><option value="gerente">Acceso total</option><option value="comercial">Socio sin usuario (solo comisiones)</option></select><button class="b">Agregar</button></form></div>
    <div class="card scroll"><h2>Comisiones (%)</h2><table><tr><th>Aseguradora</th><th>Ramo</th><th class="n">%</th></tr>
      ${(tar ?? []).map((t) => `<tr><td>${esc(t.aseguradora)}</td><td>${esc(t.ramo)}</td><td class="n">${t.pct}</td></tr>`).join('') || '<tr><td colspan="3" class="vacio">Sin tarifas.</td></tr>'}</table>
      <form class="fila" id="fc" style="margin-top:12px"><input name="aseguradora" required placeholder="Aseguradora" size="12"><input name="ramo" required placeholder="Ramo" size="10">
      <input name="pct" required type="number" step="0.01" min="0" max="100" placeholder="%" style="width:80px"><button class="b">Guardar</button></form>
      <p class="muted">Usa los mismos nombres que en las pólizas (ej. SURA / Autos). Guardar de nuevo la misma pareja actualiza el %.</p></div></div>
    <div class="card"><h2>Importar clientes o pólizas (CSV)</h2>
      <p class="muted">Clientes: columnas nombre, cedula, telefono, email, ciudad, direccion, nacimiento, asesor (correo), notas… · Pólizas: aseguradora, ramo, numero, cedula, vigencia_desde, vigencia_hasta, prima_neta. Se une por cédula y celular; nunca se duplica.</p>
      <div class="fila"><input type="file" id="csv" accept=".csv,text/csv"><label class="muted"><input type="checkbox" id="prevalece"> Este archivo prevalece (reemplaza datos guardados)</label></div>
      <p id="imp" class="muted"></p></div>
    <div class="card scroll"><h2>Plantillas</h2><table><tr><th>Canal</th><th>Nombre</th><th>Estado</th><th></th></tr>
      ${(pls ?? []).map((x) => `<tr><td>${x.canal === 'correo' ? '✉️ Correo' : '💬 WhatsApp'}</td><td>${esc(x.nombre)}</td><td>${x.activa ? 'Activa' : 'Inactiva'}</td>
        <td class="fila"><button class="s" data-ed="${x.id}">Editar</button><button class="s" data-act="${x.id}" data-a="${x.activa}">${x.activa ? 'Desactivar' : 'Activar'}</button></td></tr>`).join('')}</table>
      <form id="fp" style="margin-top:16px"><input type="hidden" name="pid"><div class="fila">
        <select name="canal"><option value="correo">✉️ Correo</option><option value="whatsapp">💬 WhatsApp</option></select>
        <input name="nombre" required placeholder="Nombre de la plantilla" style="flex:1"></div>
        <div data-solo="correo"><input name="asunto" placeholder="Asunto (puede usar {{nombre}})" style="width:100%;margin-top:8px">
          <textarea name="cuerpo" placeholder="Texto o HTML del correo. Pega aquí el HTML de tus plantillas de Outlook." style="margin-top:8px;min-height:180px"></textarea></div>
        <div data-solo="whatsapp" class="oculto fila" style="margin-top:8px"><input name="meta_nombre" placeholder="Nombre exacto aprobado en Meta (ej. retomaed)" style="flex:1">
          <input name="variables" placeholder="Variables en orden: nombre, asesor" style="flex:1"></div>
        <p class="muted">Variables: {{nombre}} {{nombre_completo}} {{asesor}} {{asesor_correo}} {{mensaje}}. Si el HTML empieza por &lt;html, se envía tal cual; si no, va dentro del diseño de Vera.</p>
        <div class="fila"><button class="b">Guardar plantilla</button><button type="button" class="s" id="limpiar">Nueva</button></div></form></div>`;
  document.getElementById('csv').onchange = (e) => importarCsv(e.target.files[0], document.getElementById('prevalece').checked, document.getElementById('imp'));
  const fp = document.getElementById('fp');
  const modo = () => fp.querySelectorAll('[data-solo]').forEach((d) => d.classList.toggle('oculto', d.dataset.solo !== fp.canal.value));
  fp.canal.onchange = modo;
  document.getElementById('limpiar').onclick = () => { fp.reset(); fp.pid.value = ''; modo(); };
  m.querySelectorAll('[data-ed]').forEach((b) => b.onclick = () => {
    const x = pls.find((y) => y.id === b.dataset.ed);
    for (const k of ['canal', 'nombre', 'asunto', 'cuerpo', 'meta_nombre']) fp[k].value = x[k] ?? '';
    fp.pid.value = x.id;
    fp.variables.value = (x.variables ?? []).join(', ');
    modo(); fp.scrollIntoView({ behavior: 'smooth' });
  });
  m.querySelectorAll('[data-act]').forEach((b) => b.onclick = async () => { await sb.from('plantilla').update({ activa: b.dataset.a !== 'true' }).eq('id', b.dataset.act); ajustes(m); });
  fp.onsubmit = async (e) => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(fp));
    const fila = { canal: d.canal, nombre: d.nombre.trim(), asunto: d.canal === 'correo' ? d.asunto.trim() : null, cuerpo: d.canal === 'correo' ? d.cuerpo : null,
      meta_nombre: d.canal === 'whatsapp' ? d.meta_nombre.trim() : null, variables: d.canal === 'whatsapp' ? d.variables.split(',').map((v) => v.trim()).filter(Boolean) : [] };
    const { error } = d.pid ? await sb.from('plantilla').update(fila).eq('id', d.pid) : await sb.from('plantilla').insert(fila);
    if (error) return alert(error.code === '23514' ? 'Faltan datos: el correo necesita asunto y texto; WhatsApp necesita el nombre de Meta.' : error.message);
    ajustes(m);
  };
  document.getElementById('fe').onsubmit = async (e) => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target)); d.email = d.email.trim().toLowerCase();
    const { error } = await sb.from('empleado').insert(d);
    if (error) alert(error.code === '23505' ? 'Ese correo ya existe.' : error.message);
    ajustes(m);
  };
  document.getElementById('fc').onsubmit = async (e) => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target));
    const { error } = await sb.from('comision_tarifa').upsert({ aseguradora: d.aseguradora.trim(), ramo: d.ramo.trim(), pct: Number(d.pct) });
    if (error) alert(error.message);
    ajustes(m);
  };
  m.querySelectorAll('[data-e]').forEach((b) => b.onclick = async () => {
    await sb.from('empleado').update({ activo: b.dataset.a !== 'true' }).eq('id', b.dataset.e);
    ajustes(m);
  });
}

// Una sola entrada: sesión guardada al cargar, o la que trae el enlace del correo.
let arrancado = false;
sb.auth.onAuthStateChange((ev, s) => {
  if (arrancado || (ev !== 'INITIAL_SESSION' && ev !== 'SIGNED_IN')) return;
  if (ev === 'INITIAL_SESSION' && !s && location.hash.includes('access_token')) return; // espera SIGNED_IN
  arrancado = !!s;
  setTimeout(inicio); // fuera del callback de auth (evita bloqueo de supabase-js)
});
</script>
